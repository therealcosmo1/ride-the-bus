// ---------- Gym: membership and a dodging workout ----------
const GYM_FEE = 40;             // asked on your first visit each month
const DODGES_PER_CIG = 5;       // dodges needed to take one off the cigarette count
// Canvas size in CSS px, and physics in px and seconds
const RUN = {
  w: 300, h: 200, ground: 172, px: 56, pw: 26, ph: 34, size: 24,
  gravity: 2600, jump: 640,                  // short, snappy jump: about 0.5s in the air
  speed: 280, speedUp: 20, maxSpeed: 760,    // px/s at the start, gained per second, and the cap (near human reaction limits)
  gap: [0.6, 1.1],                           // seconds between throws; the minimum leaves time to land
  highAfter: 1.5, highChance: 0.45,          // head-height throws start after this many seconds
  pairChance: 0.2,                           // two balls back to back on the floor, cleared with one jump
};
const LOW_THINGS = ['🏀', '⚽', '🏈'];   // roll along the floor: jump over them
const HIGH_THINGS = ['🥏', '🏐', '🎾'];  // fly at head height: stay down and they pass over

let gymPaidMonth = load('rtb_gympaid', 0);   // the month the fee was last paid for
const gymPaid = () => gymPaidMonth === month;
let working = false;   // a workout is in progress (blocks travel)
let run = null;        // { state: 'ready'|'playing'|'over', y, vy, t, last, speed, next, things: [{ x, y, icon, passed }], dodged }

const rcan = $('runner');
const rctx = rcan.getContext('2d');
(function setupRunner() {
  const dpr = window.devicePixelRatio || 1;
  rcan.width = RUN.w * dpr;
  rcan.height = RUN.h * dpr;
  rctx.scale(dpr, dpr);
})();

function setGMsg(text, kind = '') {
  const m = $('gmsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function renderGym() {
  const paid = gymPaid();
  $('gymCard').innerHTML = careerCardHTML(
    paid ? `🏋️ Paid for month ${month}` : `💳 Month ${month} fee due`, '', paid ? 100 : 0,
    paid ? 'Work out as much as you like until the month ends.' : `${fmt(GYM_FEE)} gets you in for the rest of the month.`);
  $('gq').textContent = !paid ? `The front desk wants this month's ${fmt(GYM_FEE)} fee before you can work out.`
    : working ? 'Jump the balls on the floor. Stay down for the ones flying high. It gets fast.'
    : 'Ready to sweat?';
  $('gymPay').classList.toggle('hidden', paid);
  $('gymPay').textContent = `Pay ${fmt(GYM_FEE)}`;
  $('gymPay').disabled = spendable() < GYM_FEE;
  $('gymStart').classList.toggle('hidden', !paid || working);
  $('gymStart').textContent = run ? '🏃 Work out again' : '🏃 Work out';
  rcan.classList.toggle('hidden', !paid || !run);
  $('gymInfo').textContent = !paid ? (spendable() < GYM_FEE ? `You need ${fmt(GYM_FEE)}. Come back when you have it.` : '')
    : working ? 'Tap the game or press Space to jump.'
    : `🚬 Cigarettes smoked: ${cigsSmoked}. Every ${DODGES_PER_CIG} dodges takes one off. A workout takes ${DAYS_PER_EVENT} days.`;
}

function payGym() {
  if (gymPaid() || spendable() < GYM_FEE) return;
  bank -= GYM_FEE;
  save('rtb_bank', bank);
  gymPaidMonth = month;
  save('rtb_gympaid', gymPaidMonth);
  beep(1568, 0.08, 'triangle', 0.08);
  setTimeout(() => beep(2093, 0.25, 'triangle', 0.08), 70);
  setGMsg(`Paid! You're in for the rest of month ${month}.`, 'good');
  renderGym();
  renderStats();
}

function startWorkout() {
  if (!gymPaid() || working) return;
  beep(1, 0.01, 'sine', 0.001); // unlock audio on this tap
  working = true;
  run = { state: 'ready', y: 0, vy: 0, t: 0, last: performance.now(), speed: RUN.speed, next: 1.2, things: [], dodged: 0 };
  setGMsg('');
  renderGym();
  renderMap();
  requestAnimationFrame(runLoop);
}

function jump() {
  if (!run || !working) return;
  if (run.state === 'ready') { run.state = 'playing'; return; }
  if (run.state !== 'playing' || run.y > 0) return;   // only from the floor
  run.vy = RUN.jump;
  beep(440, 0.05, 'square', 0.04);
}

function runLoop(now) {
  const r = run;
  if (!r || (r.state !== 'ready' && r.state !== 'playing')) return;
  const dt = Math.max(0, Math.min(0.033, (now - r.last) / 1000));
  r.last = now;
  if (r.state === 'playing') {
    r.t += dt;
    r.speed = Math.min(RUN.maxSpeed, RUN.speed + r.t * RUN.speedUp);
    // Height above the floor
    r.vy -= RUN.gravity * dt;
    r.y = Math.max(0, r.y + r.vy * dt);
    if (r.y === 0) r.vy = 0;
    // Spawn: gaps are long enough to land from one jump before the next thing arrives
    r.next -= dt;
    if (r.next <= 0) {
      const high = r.t > RUN.highAfter && Math.random() < RUN.highChance;
      const list = high ? HIGH_THINGS : LOW_THINGS;
      const pair = !high && r.t > RUN.highAfter && Math.random() < RUN.pairChance;
      for (let i = 0; i < (pair ? 2 : 1); i++) {
        r.things.push({
          x: RUN.w + RUN.size + i * (RUN.size + 6),
          y: high ? RUN.ph + 6 + RUN.size / 2 : RUN.size / 2,   // centre height above the floor
          icon: list[Math.floor(Math.random() * list.length)],
          passed: false,
        });
      }
      r.next = RUN.gap[0] + Math.random() * (RUN.gap[1] - RUN.gap[0]) + (pair ? 0.1 : 0);
    }
    // Player box (in height-above-floor units) and collisions
    const pL = RUN.px - RUN.pw / 2 + 4, pR = RUN.px + RUN.pw / 2 - 4, pB = r.y + 2, pT = r.y + RUN.ph - 4;
    for (const th of r.things) {
      th.x -= r.speed * dt;
      const half = RUN.size / 2 - 4;
      if (th.x + half > pL && th.x - half < pR && th.y + half > pB && th.y - half < pT) return endWorkout();
      if (!th.passed && th.x + RUN.size / 2 < pL) {
        th.passed = true;
        r.dodged++;
        if (r.dodged % DODGES_PER_CIG === 0) beep(1046, 0.1, 'triangle', 0.12);
      }
    }
    r.things = r.things.filter(th => th.x > -RUN.size);
  }
  drawRunner();
  requestAnimationFrame(runLoop);
}

function drawRunner() {
  const r = run, c = rctx, floor = RUN.ground;
  const bg = c.createLinearGradient(0, 0, 0, RUN.h);
  bg.addColorStop(0, '#2b4a5e');
  bg.addColorStop(1, '#1c3242');
  c.fillStyle = bg;
  c.fillRect(0, 0, RUN.w, RUN.h);
  c.fillStyle = '#5a3d27';
  c.fillRect(0, floor, RUN.w, RUN.h - floor);
  c.fillStyle = 'rgba(245,197,66,.6)';
  c.fillRect(0, floor, RUN.w, 2);
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = `${RUN.size}px system-ui, sans-serif`;
  for (const th of r.things) c.fillText(th.icon, th.x, floor - th.y);
  // Runner, flipped to face right
  c.save();
  c.translate(RUN.px, floor - r.y - RUN.ph / 2);
  c.scale(-1, 1);
  c.font = '32px system-ui, sans-serif';
  c.fillText('🏃', 0, 2);
  c.restore();
  c.fillStyle = '#fff';
  c.font = 'bold 16px system-ui, sans-serif';
  c.textBaseline = 'top';
  c.fillText(`Dodged ${r.dodged} · −${Math.floor(r.dodged / DODGES_PER_CIG)} 🚬`, RUN.w / 2, 10);
  const banner = r.state === 'ready' ? 'Tap or press Space to start' : r.state === 'over' ? 'Ouch! Workout over' : '';
  if (banner) {
    c.fillStyle = 'rgba(0,0,0,.55)';
    c.fillRect(20, 70, RUN.w - 40, 36);
    c.fillStyle = r.state === 'over' ? '#ff8a8a' : '#f5c542';
    c.font = 'bold 16px system-ui, sans-serif';
    c.textBaseline = 'middle';
    c.fillText(banner, RUN.w / 2, 88);
  }
}

function endWorkout() {
  const r = run;
  r.state = 'over';
  drawRunner();
  working = false;
  beep(140, 0.25, 'sawtooth', 0.12);
  const quit = Math.min(cigsSmoked, Math.floor(r.dodged / DODGES_PER_CIG));
  cigsSmoked -= quit;
  save('rtb_cigs', cigsSmoked);
  setGMsg(quit
    ? `Dodged ${r.dodged}! Your cigarette count dropped by ${quit} to ${cigsSmoked}.`
    : r.dodged >= DODGES_PER_CIG ? `Dodged ${r.dodged}! You're already smoke-free.`
    : `Dodged ${r.dodged}. Get ${DODGES_PER_CIG} to make a dent in the habit.`, quit ? 'good' : '');
  renderGym();
  renderMap();
  passTime(DAYS_PER_EVENT);
  renderGym();   // the month may have just ended, so the fee is due again
}

$('gymPay').onclick = payGym;
$('gymStart').onclick = startWorkout;
rcan.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

// ---------- Traffic: a crossy-road crossing on some trips ----------
const TRAFFIC_FROM = 3;          // no traffic before this month
const TRAFFIC_BASE = 0.08;       // chance per trip in that month
const TRAFFIC_GROWTH = 0.02;     // added each month after
const TRAFFIC_MAX = 0.3;
const HOSPITAL_BILL = 150;
// Grid in CSS px: row 0 is the far curb (the goal), the last row is where you start, and the median is safe
const TR = { cell: 30, cols: 10, rows: 11, median: 5 };
TR.w = TR.cell * TR.cols;
TR.h = TR.cell * TR.rows;
const VEHICLES = [   // w in cells
  { icon: '🚗', w: 1 }, { icon: '🚕', w: 1 }, { icon: '🚙', w: 1 }, { icon: '🚓', w: 1 }, { icon: '🚚', w: 1.5 },
];
const CROSS_KEYS = {
  ArrowUp: 'up', KeyW: 'up', Space: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
};
const HOPS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

let crossing = null;   // { dest, state: 'playing'|'won'|'crashed', col, row, last, lanes: [{ row, dir, speed, cars: [{ x, w, icon }] }] }

const placeName = k => k === 'home' ? 'home' : `the ${PLACES[k].name}`;
const trafficChance = () => month < TRAFFIC_FROM ? 0 : Math.min(TRAFFIC_MAX, TRAFFIC_BASE + (month - TRAFFIC_FROM) * TRAFFIC_GROWTH);
const trafficSpeed = () => Math.min(1.5, 1 + Math.max(0, month - TRAFFIC_FROM) * 0.04);   // cars get faster too

const tcan = $('road');
const tctx = tcan.getContext('2d');
(function setupRoad() {
  const dpr = window.devicePixelRatio || 1;
  tcan.width = TR.w * dpr;
  tcan.height = TR.h * dpr;
  tctx.scale(dpr, dpr);
})();

// Cars wrap around a loop a little wider than the road, so they enter and leave out of sight
const LANE_LO = -1.5 * TR.cell;
const LANE_LEN = TR.w + 3 * TR.cell;

function makeLanes() {
  const C = TR.cell, lanes = [];
  let dir = 1;
  for (let row = 1; row < TR.rows - 1; row++) {
    if (row === TR.median) continue;
    dir = -dir;
    const cars = [];
    let x = LANE_LO + Math.random() * 2 * C;
    for (;;) {
      const v = VEHICLES[Math.floor(Math.random() * VEHICLES.length)];
      const w = v.w * C;
      // Every gap, including the one across the wrap, is at least 1.6 cells: room to stand
      if (x + w > LANE_LO + LANE_LEN - 1.6 * C) break;
      cars.push({ x: x + w / 2, w, icon: v.icon });
      x += w + (1.6 + Math.random() * 2.6) * C;
    }
    lanes.push({ row, dir, speed: (40 + Math.random() * 55) * trafficSpeed(), cars });
  }
  return lanes;
}

function startCrossing(dest, x) {
  crossing = { dest, state: 'playing', col: Math.floor(TR.cols / 2), row: TR.rows - 1, last: performance.now(), lanes: makeLanes() };
  placeBus(dest, x);   // the bus stops between the two locations where traffic hit
  renderMap();
  beep(300, 0.12, 'square', 0.08);
  setTimeout(() => beep(300, 0.2, 'square', 0.08), 160);
  $('trafficText').textContent = `Get across to reach ${placeName(dest)}. Get hit and it's a ${fmt(HOSPITAL_BILL)} hospital bill.`;
  $('traffic').classList.remove('hidden');
  drawCrossing();
  requestAnimationFrame(crossLoop);
}

function hop(dir) {
  const c = crossing;
  if (!c || c.state !== 'playing') return;
  const [dc, dr] = HOPS[dir];
  c.col = Math.max(0, Math.min(TR.cols - 1, c.col + dc));
  c.row = Math.max(0, Math.min(TR.rows - 1, c.row + dr));
  beep(dir === 'up' ? 620 : 520, 0.04, 'square', 0.04);
  if (c.row === 0) return endCrossing(true);
  if (crossHit()) endCrossing(false);
  else drawCrossing();
}

// Is a car on the player's square? The boxes are shrunk a little so near misses count as misses
function crossHit() {
  const c = crossing, lane = c.lanes.find(l => l.row === c.row);
  if (!lane) return false;
  const px = c.col * TR.cell + TR.cell / 2;
  return lane.cars.some(car => Math.abs(car.x - px) < car.w / 2 + TR.cell / 2 - 7);
}

function crossLoop(now) {
  const c = crossing;
  if (!c || c.state !== 'playing') return;
  const dt = Math.max(0, Math.min(0.033, (now - c.last) / 1000));
  c.last = now;
  for (const lane of c.lanes) {
    for (const car of lane.cars) {
      car.x += lane.dir * lane.speed * dt;
      car.x = LANE_LO + (((car.x - LANE_LO) % LANE_LEN) + LANE_LEN) % LANE_LEN;
    }
  }
  if (crossHit()) return endCrossing(false);
  drawCrossing();
  requestAnimationFrame(crossLoop);
}

function drawCrossing() {
  const c = crossing, g = tctx, C = TR.cell;
  for (let row = 0; row < TR.rows; row++) {
    const curb = row === 0 || row === TR.rows - 1;
    g.fillStyle = curb ? '#7d7d70' : row === TR.median ? '#3f6b46' : '#363636';
    g.fillRect(0, row * C, TR.w, C);
  }
  g.fillStyle = 'rgba(245,197,66,.35)';
  g.fillRect(0, 0, TR.w, C);   // the goal glows
  // Dashed lines between neighbouring lanes
  g.strokeStyle = 'rgba(255,255,255,.45)';
  g.lineWidth = 2;
  g.setLineDash([10, 10]);
  for (const lane of c.lanes) {
    if (c.lanes.some(l => l.row === lane.row + 1)) {
      g.beginPath();
      g.moveTo(0, (lane.row + 1) * C);
      g.lineTo(TR.w, (lane.row + 1) * C);
      g.stroke();
    }
  }
  g.setLineDash([]);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.font = 'bold 13px system-ui, sans-serif';
  g.fillText(`🏁 ${PLACES[c.dest].name}`, TR.w / 2, C / 2);
  for (const lane of c.lanes) {
    for (const car of lane.cars) {
      g.save();
      g.translate(car.x, lane.row * C + C / 2 + 1);
      if (lane.dir > 0) g.scale(-1, 1);   // vehicle emoji face left
      g.font = `${Math.round(car.w - 4)}px system-ui, sans-serif`;
      g.fillText(car.icon, 0, 0);
      g.restore();
    }
  }
  // The bus, turned to face up the screen
  g.save();
  g.translate(c.col * C + C / 2, c.row * C + C / 2);
  g.rotate(Math.PI / 2);
  g.font = '24px system-ui, sans-serif';
  g.fillText('🚌', 0, 1);
  g.restore();
  if (c.state === 'crashed') {
    g.font = '34px system-ui, sans-serif';
    g.fillText('💥', c.col * C + C / 2, c.row * C + C / 2);
  }
  const banner = c.state === 'won' ? 'Made it! 🎉' : c.state === 'crashed' ? 'Crashed!' : '';
  if (banner) {
    g.fillStyle = 'rgba(0,0,0,.6)';
    g.fillRect(20, TR.h / 2 - 20, TR.w - 40, 40);
    g.fillStyle = c.state === 'crashed' ? '#ff8a8a' : '#f5c542';
    g.font = 'bold 18px system-ui, sans-serif';
    g.fillText(banner, TR.w / 2, TR.h / 2);
  }
}

function endCrossing(made) {
  const c = crossing;
  c.state = made ? 'won' : 'crashed';
  drawCrossing();
  if (made) {
    beep(1046, 0.1, 'triangle', 0.12);
    setTimeout(() => beep(1568, 0.2, 'triangle', 0.12), 90);
  } else {
    beep(110, 0.45, 'sawtooth', 0.18);
  }
  travelTimer = setTimeout(() => {
    $('traffic').classList.add('hidden');
    crossing = null;
    if (made) return drive(c.dest);
    // Crashed: you're patched up and back where you started, with a bill that can put you in the red
    bank -= HOSPITAL_BILL;
    save('rtb_bank', bank);
    traveling = false;
    placeBus(loc);
    showLocation();
    showModal('🚑', 'Crash!', `You got hit in traffic. The hospital patched you up and billed you ${fmt(HOSPITAL_BILL)}. You've got ${fmt(bank)} now, and you're back at ${placeName(loc)}.`, 'Ouch', () => {}, 'bad');
  }, made ? 600 : 1100);
}

document.querySelectorAll('[data-move]').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault();
  hop(b.dataset.move);
}));
// Tapping the road hops toward the tap: sideways if it's more to the side than ahead or behind
tcan.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!crossing) return;
  const r = tcan.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * TR.w - (crossing.col + 0.5) * TR.cell;
  const y = (e.clientY - r.top) / r.height * TR.h - (crossing.row + 0.5) * TR.cell;
  hop(Math.abs(x) > Math.abs(y) ? (x < 0 ? 'left' : 'right') : (y < 0 ? 'up' : 'down'));
});

// ---------- Bank: savings, loans and a credit score ----------
const SAVE_RATE = 0.002;       // savings interest per day (about 6% a month)
const LOAN_FEE = 0.05;         // added to the balance up front
const LOAN_DAYS = 30;          // the bank collects whatever is left after this many days
const CREDIT_ON_TIME = 20;     // credit for paying a loan off before it's due
const CREDIT_COLLECTED = 75;   // credit lost when the bank has to collect
const CREDIT_HIST = [-250, 150];   // range of the repayment part of the score
// Borrow limit and daily interest by credit score
const CREDIT_TIERS = [
  { min: 300, name: 'Poor', limit: 0, rate: 0 },
  { min: 500, name: 'Fair', limit: 150, rate: 0.012 },
  { min: 580, name: 'Good', limit: 500, rate: 0.008 },
  { min: 670, name: 'Very good', limit: 1200, rate: 0.005 },
  { min: 740, name: 'Excellent', limit: 3000, rate: 0.003 },
];

// Credit card: bought at the Store, limits raised here once your score is high enough
const CARD_PRICE = 500;
const CARD_LIMITS = [500, 1000, 2000, 5000];
const CARD_SCORES = [0, 580, 670, 740];   // credit score needed for each limit
const CARD_RATE = 0.005;                  // daily interest on a negative balance

let cardLimit = load('rtb_card', 0);   // 0 = no card
const spendable = () => bank + cardLimit;   // how far you can spend, card included

let savings = load('rtb_savings', 0);
let loan = loadLoan();   // { bal, rate, due } where due is a day number from today()
let creditHist = load('rtb_credit', 0);   // repayment record: on-time payoffs minus collections

function loadLoan() {
  try { const l = JSON.parse(localStorage.getItem('rtb_loan') || 'null'); return l && l.bal > 0 ? l : null; }
  catch { return null; }
}
function saveBank() {
  save('rtb_savings', savings);
  save('rtb_credit', creditHist);
  try { localStorage.setItem('rtb_loan', JSON.stringify(loan)); } catch {}
}
const today = () => (month - 1) * DAYS_PER_MONTH + day;
const ratePct = r => (r * 100).toFixed(1).replace(/\.0$/, '') + '%';
const signed = n => (n < 0 ? '−' : '+') + Math.abs(n);

// The score is 450 plus these parts, kept between 300 and 850
function creditParts() {
  const net = bank + savings - (loan ? loan.bal : 0);
  return {
    jobs: 50 * ((unemployed ? 0 : 1) + (barJob ? 1 : 0)),
    ranks: 12 * ((unemployed ? 0 : rankIndex(xp)) + (barJob ? rankIndex(barXp, BAR_RANKS) : 0)),
    history: creditHist,
    money: Math.max(-100, Math.min(120, Math.round(net / 25))),
  };
}
function creditScore() {
  const p = creditParts();
  return Math.max(300, Math.min(850, 450 + p.jobs + p.ranks + p.history + p.money));
}
function creditTier(s = creditScore()) {
  let i = 0;
  while (i + 1 < CREDIT_TIERS.length && s >= CREDIT_TIERS[i + 1].min) i++;
  return i;
}

function setKMsg(text, kind = '') {
  const m = $('kmsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function renderBank(resetInputs = false) {
  const score = creditScore(), ti = creditTier(score), t = CREDIT_TIERS[ti], next = CREDIT_TIERS[ti + 1], p = creditParts();
  $('creditCard').innerHTML = careerCardHTML(
    `📊 Credit ${score} · ${t.name}`, next ? `Next: ${next.name} at ${next.min}` : 'Top tier', (score - 300) / 550 * 100,
    `Jobs ${signed(p.jobs)} · Ranks ${signed(p.ranks)} · Repayment ${signed(p.history)} · Money ${signed(p.money)}`);
  $('saveHead').textContent = `🐷 Savings: ${fmt(savings)}`;
  $('saveDesc').textContent = `Earns ${ratePct(SAVE_RATE)} a day (about 6% a month). If your cash can't cover rent, the rest comes out of savings.`;
  $('deposit').disabled = bank < 1;
  $('withdraw').disabled = Math.round(savings) < 1;
  const lb = $('loanBtn');
  if (loan) {
    const owed = Math.ceil(loan.bal), left = loan.due - today();
    $('loanHead').textContent = `💸 Loan: you owe ${fmt(owed)}`;
    $('loanDesc').textContent = `${ratePct(loan.rate)} interest a day. Due in ${left} day${left === 1 ? '' : 's'}: whatever's left then gets taken from savings, then cash, even if that puts you in the red, and costs ${CREDIT_COLLECTED} credit. Paying it off first adds ${CREDIT_ON_TIME}.`;
    lb.textContent = 'Repay';
    lb.disabled = bank < 1;
  } else if (t.limit) {
    $('loanHead').textContent = `💸 Borrow up to ${fmt(t.limit)}`;
    $('loanDesc').textContent = `${ratePct(LOAN_FEE)} fee up front, then ${ratePct(t.rate)} interest a day. Due in ${LOAN_DAYS} days. One loan at a time.`;
    lb.textContent = 'Borrow';
    lb.disabled = false;
  } else {
    $('loanHead').textContent = '💸 No loans yet';
    $('loanDesc').textContent = `The bank won't lend below a ${CREDIT_TIERS[1].min} score. Jobs, promotions, money in the bank and paying loans back on time all raise it.`;
  }
  $('loanRow').classList.toggle('hidden', !loan && !t.limit);
  const ci = CARD_LIMITS.indexOf(cardLimit), nextLimit = CARD_LIMITS[ci + 1], need = CARD_SCORES[ci + 1];
  $('cardHead').textContent = cardLimit ? `💳 Card limit: ${fmt(cardLimit)}` : '💳 No credit card';
  $('cardDesc').textContent = !cardLimit ? `Buy one at the Store for ${fmt(CARD_PRICE)} to spend below zero.`
    : (bank < 0 ? `You're ${fmt(-bank)} into it, at ${ratePct(CARD_RATE)} a day. Deposit cash to pay it down. ` : `${ratePct(CARD_RATE)} interest a day while you're below zero. `)
      + (nextLimit ? `Upgrade to ${fmt(nextLimit)} with a credit score of ${need}${score < need ? ` (you have ${score})` : ''}.` : 'That\'s the top limit.');
  $('cardRow').classList.toggle('hidden', !cardLimit || !nextLimit);
  $('cardUp').textContent = nextLimit ? `Upgrade to ${fmt(nextLimit)}` : '';
  $('cardUp').disabled = score < need;
  $('bankInfo').textContent = 'Banking takes no time. Interest is added every day that passes.';
  if (resetInputs) {
    $('saveAmt').value = Math.max(0, bank) || Math.round(savings) || '';
    $('loanAmt').value = loan ? Math.min(Math.ceil(loan.bal), Math.max(0, bank)) || '' : t.limit || '';
  }
}

function bankAmount(id) { return Math.floor(Number($(id).value) || 0); }

function ching() {
  beep(1568, 0.08, 'triangle', 0.08);
  setTimeout(() => beep(2093, 0.25, 'triangle', 0.08), 70);
}

function bankDone(text, kind = 'good') {
  saveBank();
  save('rtb_bank', bank);
  if (kind === 'good') ching();
  setKMsg(text, kind);
  renderBank(true);
  renderStats();
}

function deposit() {
  const amt = Math.min(bankAmount('saveAmt'), bank);
  if (amt < 1) return setKMsg('Enter an amount you have in cash.', 'bad');
  bank -= amt;
  savings += amt;
  bankDone(`Deposited ${fmt(amt)}.`);
}

function withdraw() {
  let amt = bankAmount('saveAmt');
  if (amt < 1 || Math.round(savings) < 1) return setKMsg('Enter an amount to withdraw.', 'bad');
  if (amt >= Math.round(savings)) { amt = Math.round(savings); savings = 0; }   // take the cents too
  else savings -= amt;
  bank += amt;
  updateHigh();
  bankDone(`Withdrew ${fmt(amt)}.`);
}

function loanAction() {
  const amt = bankAmount('loanAmt');
  if (loan) {
    const pay = Math.min(amt, Math.ceil(loan.bal), bank);
    if (pay < 1) return setKMsg('Enter an amount you have in cash.', 'bad');
    bank -= pay;
    loan.bal -= pay;
    if (loan.bal < 0.5) {
      loan = null;
      creditHist = Math.min(CREDIT_HIST[1], creditHist + CREDIT_ON_TIME);
      return bankDone(`Paid ${fmt(pay)}. Loan paid off! +${CREDIT_ON_TIME} credit.`);
    }
    return bankDone(`Paid ${fmt(pay)}. You still owe ${fmt(Math.ceil(loan.bal))}.`);
  }
  const t = CREDIT_TIERS[creditTier()];
  if (!t.limit) return;
  if (amt < 1 || amt > t.limit) return setKMsg(`You can borrow ${fmt(1)} to ${fmt(t.limit)}.`, 'bad');
  bank += amt;
  loan = { bal: amt * (1 + LOAN_FEE), rate: t.rate, due: today() + LOAN_DAYS };
  bankDone(`Borrowed ${fmt(amt)}. You owe ${fmt(Math.ceil(loan.bal))} with the fee, due in ${LOAN_DAYS} days.`);
}

// The loan came due: take it from savings first, then cash, which can go negative
function collectLoan() {
  const owed = Math.ceil(loan.bal);
  const fromSavings = Math.min(Math.floor(savings), owed);
  savings -= fromSavings;
  bank -= owed - fromSavings;
  loan = null;
  creditHist = Math.max(CREDIT_HIST[0], creditHist - CREDIT_COLLECTED);
  saveBank();
  save('rtb_bank', bank);
  showModal('🏦', 'Loan collected',
    `Your loan was due, so the bank took the ${fmt(owed)} you owed` + (fromSavings ? ` (${fmt(fromSavings)} from savings)` : '')
    + `. You've got ${fmt(bank)} in cash. −${CREDIT_COLLECTED} credit.`,
    'OK', () => (loc === 'casino' ? toBet() : loc === 'bank' ? renderBank(true) : renderStats()), 'bad');
}

function upgradeCard() {
  const i = CARD_LIMITS.indexOf(cardLimit);
  if (!cardLimit || i + 1 >= CARD_LIMITS.length || creditScore() < CARD_SCORES[i + 1]) return;
  cardLimit = CARD_LIMITS[i + 1];
  save('rtb_card', cardLimit);
  bankDone(`💳 Limit raised: you can spend down to ${fmt(-cardLimit)}.`);
}

$('cardUp').onclick = upgradeCard;
$('deposit').onclick = deposit;
$('withdraw').onclick = withdraw;
$('loanBtn').onclick = loanAction;

// ---------- Calendar and rent ----------
function rentFor(m) { return Math.round(BASE_RENT * RENT_GROWTH ** (m - 1)); }

function renderCalendar() {
  const rent = rentFor(month);
  const left = Math.max(0, DAYS_PER_MONTH - day);
  $('calMonth').textContent = `📅 Month ${month} · Day ${Math.min(day + 1, DAYS_PER_MONTH)}/${DAYS_PER_MONTH}`;
  const r = $('calRent');
  r.textContent = left ? `Rent ${fmt(rent)} in ${left} day${left === 1 ? '' : 's'}` : `Rent ${fmt(rent)} due now`;
  const short = spendable() + savings < rent;   // savings and the card cover rent too
  r.classList.toggle('short', short);
  const fill = $('calFill');
  fill.style.width = (day / DAYS_PER_MONTH * 100) + '%';
  fill.classList.toggle('late', short && left <= 6);
  const due = loan && loan.due - today();
  $('calNote').textContent = loan
    ? `💸 Loan of ${fmt(Math.ceil(loan.bal))} due in ${due} day${due === 1 ? '' : 's'}. Pay it at the Bank.`
    : 'A hand takes 1 day, everything else takes 3. Rent is due at the end of each 30-day month.';
}

function saveCalendar() { save('rtb_month', month); save('rtb_day', day); }

function passTime(days) {
  // Interest compounds every day
  for (let i = 0; i < days; i++) {
    savings *= 1 + SAVE_RATE;
    if (loan) loan.bal *= 1 + loan.rate;
    if (cardLimit && bank < 0) bank -= Math.ceil(-bank * CARD_RATE);   // card interest, whole dollars
  }
  save('rtb_bank', bank);
  day += days;
  if (loan && today() >= loan.due) collectLoan();
  saveBank();
  if (day >= DAYS_PER_MONTH) {
    const rent = rentFor(month);
    if (spendable() + savings >= rent) {
      // Cash first, then savings, then the card for the rest
      const fromCash = Math.max(0, Math.min(bank, rent));
      const fromSavings = Math.min(savings, rent - fromCash);
      const fromCard = rent - fromCash - fromSavings;
      bank -= fromCash + fromCard;
      savings = Math.max(0, savings - fromSavings);
      month++;
      day -= DAYS_PER_MONTH;
      saveCalendar();
      saveBank();
      save('rtb_bank', bank);
      const parts = [fromSavings >= 0.5 && `${fmt(fromSavings)} from savings`, fromCard > 0 && `${fmt(fromCard)} on your card`].filter(Boolean);
      showModal('🏠', `Month ${month - 1} is over`,
        `You paid ${fmt(rent)} in rent` + (parts.length ? ` (${parts.join(', ')})` : '')
        + ` and have ${fmt(bank)} in cash` + (savings >= 0.5 ? ` and ${fmt(savings)} saved` : '') + ` left. Next month's rent is ${fmt(rentFor(month))}.`
        + (month === TRAFFIC_FROM ? ` Watch out: from now on, traffic can hold you up when you travel.` : ''),
        'Keep going', () => (loc === 'casino' ? toBet() : loc === 'bank' ? renderBank(true) : renderStats()));
    } else {
      const had = Math.max(0, spendable()) + savings;
      showModal('📦', 'Evicted!',
        `Rent for month ${month} was ${fmt(rent)} and you could only cover ${fmt(had)}${savings >= 0.5 || cardLimit ? ' counting savings and your card' : ''}. You lose. Back to month 1 with ${fmt(START_MONEY)} and no jobs. Your high score is kept.`,
        'Start over', restartGame, 'bad');
    }
  }
  saveCalendar();
  renderStats();
  if (loc === 'bank') renderBank();
}

function restartGame() {
  bank = START_MONEY;
  month = 1;
  day = 0;
  save('rtb_bank', bank);
  saveCalendar();
  loc = 'casino';
  inv = { cigs: 0, wagyu: 0 };
  bring.cigs = bring.wagyu = true;
  hasId = false;

  working = false;
  save('rtb_id', 0);
  saveInv();
  xp = 0;
  unemployed = true;
  hoopsNeeded = START_HOOPS;
  apps = [];
  saveCareer();
  barJob = false;
  barXp = 0;
  drink = null;
  simon = null;
  saveBar();
  saveDrink();
  savings = 0;
  cardLimit = 0;
  save('rtb_card', 0);

  crossing = null;
  $('traffic').classList.add('hidden');
  $('bus').classList.remove('right');
  $('bus').style.left = PLACES.casino.x + '%';
  $('wager').value = Math.min(10, bank);
  showLocation();
  setMsg(`Month 1. You've got ${fmt(bank)} and no jobs. Rent is ${fmt(rentFor(1))} in ${DAYS_PER_MONTH} days.`);
}

function modalOpen() { return !$('modal').classList.contains('hidden'); }

const modalQueue = [];   // popups wait their turn if one is already showing

function showModal(icon, title, text, btn, onClose, kind = '') {
  if (modalOpen()) { modalQueue.push([icon, title, text, btn, onClose, kind]); return; }
  $('modalIcon').textContent = icon;
  $('modalTitle').textContent = title;
  $('modalText').textContent = text;
  $('modalBtn').textContent = btn;
  $('modal').className = 'modal ' + kind;
  $('modalBtn').onclick = () => {
    $('modal').classList.add('hidden');
    onClose();
    if (modalQueue.length) showModal(...modalQueue.shift());
  };
  $('modalBtn').focus();
}

$('wager').value = Math.min(10, Math.max(1, bank));
showLocation();
renderAchBtn();
if (cigsSmoked >= IRON_LUNG_CIGS) unlock('lung');   // saves from before achievements existed
// Page was closed with rent still due
if (day >= DAYS_PER_MONTH) passTime(0);
</script>
</body>
</html>
