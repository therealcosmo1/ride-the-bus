<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride the Bus</title>
<style>
  :root {
    --felt: #0f5132;
    --felt-dark: #0a3a24;
    --gold: #f5c542;
    --text: #f3f3f3;
    --muted: #b9d3c4;
    --red: #d62839;
    --black: #1b1b1b;
    --btn: #1f7a4d;
    --btn-hover: #279160;
  }
  * { box-sizing: border-box; }
  /* No double-tap zoom, which also removes the browser's wait-and-see tap delay */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  button, .loc, .kitchen, .flappy {
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% 30%, var(--felt), var(--felt-dark));
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { text-align: center; margin: 0 0 4px; letter-spacing: 2px; color: var(--gold); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
  }
  .stat {
    background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px; text-align: center;
  }
  .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .stat.hs .value { color: var(--gold); }
  .stat .value.neg { color: #ff8a8a; }
  .card-left { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-left:empty { display: none; }

  .cards {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
  }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .slot .mult { font-size: 13px; color: var(--muted); }
  .slot.active .mult { color: var(--gold); font-weight: 700; }
  .card {
    width: 100%; max-width: 120px; aspect-ratio: 5 / 7; border-radius: 10px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 8px; font-weight: 700; user-select: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    transition: transform .25s;
  }
  .card.back {
    background: repeating-linear-gradient(45deg, #8b1e2d 0 8px, #a52a3a 8px 16px);
    border: 4px solid #fff;
  }
  .card.empty { background: rgba(0,0,0,.18); border: 2px dashed rgba(255,255,255,.25); box-shadow: none; }
  .card.face { background: #fff; animation: flip .3s ease; }
  .card.face.red { color: var(--red); }
  .card.face.black { color: var(--black); }
  .card .corner { font-size: clamp(14px, 3.5vw, 20px); line-height: 1; }
  .card .corner.br { align-self: flex-end; transform: rotate(180deg); }
  .card .pip { align-self: center; font-size: clamp(28px, 8vw, 48px); line-height: 1; }
  .card.win { outline: 4px solid var(--gold); }
  .card.lose { outline: 4px solid var(--red); }
  .card.tie { outline: 4px dashed #9ec5ff; opacity: .8; }
  @keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }

  .msg {
    text-align: center; min-height: 28px; font-size: 18px; font-weight: 600; margin-bottom: 14px;
  }
  .msg.good { color: var(--gold); }
  .msg.bad { color: #ff8a8a; }

  .panel { background: rgba(0,0,0,.25); border-radius: 12px; padding: 16px; }
  .question { text-align: center; font-size: 16px; margin-bottom: 12px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button {
    font: inherit; font-weight: 600; color: var(--text); background: var(--btn);
    border: none; border-radius: 8px; padding: 12px 18px; cursor: pointer; min-width: 90px;
    transition: background .15s, transform .05s;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.red { background: var(--red); }
  button.black { background: #333; }
  button.gold { background: var(--gold); color: #222; }
  button.small { min-width: 0; padding: 8px 12px; }

  .wager { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .wager-input { display: flex; align-items: center; gap: 8px; }
  .wager-input input {
    width: 120px; font: inherit; font-size: 20px; text-align: center; padding: 8px;
    border-radius: 8px; border: none; background: #fff; color: #111;
  }
  input[type=range] { width: 100%; max-width: 360px; accent-color: var(--gold); }
  .cashout { margin-top: 12px; text-align: center; }
  .footer { text-align: center; margin-top: 16px; }
  .link { background: none; color: var(--muted); text-decoration: underline; min-width: 0; padding: 4px; font-weight: 400; font-size: 13px; }
  .link:hover:not(:disabled) { background: none; color: var(--text); }
  .hidden { display: none !important; }

  /* Calendar */
  .calendar { background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .cal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
  .cal-month { font-weight: 700; color: var(--gold); white-space: nowrap; }
  #calRent { text-align: right; color: var(--muted); }
  #calRent.short { color: #ff8a8a; font-weight: 600; }
  .cal-bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.35); margin: 8px 0 6px; overflow: hidden; }
  .cal-fill { height: 100%; width: 0; background: var(--gold); border-radius: 4px; transition: width .4s; }
  .cal-fill.late { background: var(--red); }
  .cal-note { font-size: 12px; color: var(--muted); text-align: center; }

  .modal {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.65);
    display: grid; place-items: center; padding: 16px;
  }
  .modal-box {
    background: var(--felt-dark); border: 2px solid var(--gold); border-radius: 14px;
    padding: 22px 20px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .modal-icon { font-size: 44px; line-height: 1; }
  .modal-box h2 { margin: 10px 0 6px; color: var(--gold); }
  .modal-box p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .modal.bad .modal-box { border-color: var(--red); }
  .modal.bad h2 { color: #ff8a8a; }

  /* Map */
  .map { background: rgba(0,0,0,.25); border-radius: 12px; padding: 12px 16px 14px; margin-bottom: 20px; }
  .map-area { position: relative; height: 108px; }
  .road {
    position: absolute; left: 7%; right: 7%; top: 58px; height: 10px; border-radius: 5px;
    background: #3a3a3a; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .road::after {
    content: ''; position: absolute; left: 8px; right: 8px; top: 4px;
    border-top: 2px dashed rgba(245,197,66,.7);
  }
  .loc {
    position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column;
    align-items: center; gap: 2px; background: none; min-width: 0; padding: 0; font-weight: 600;
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  }
  .loc:hover:not(:disabled) { background: none; color: var(--text); }
  .loc:disabled { opacity: 1; cursor: default; }
  /* Keep the centring when pressed; the generic button press nudge would replace it */
  .loc:active:not(:disabled) { transform: translateX(-50%) translateY(1px); }
  .loc .icon {
    font-size: 22px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.2);
  }
  .loc.here { color: var(--gold); }
  .loc.here .icon { border-color: var(--gold); box-shadow: 0 0 12px rgba(245,197,66,.5); }
  .loc[data-loc=home] { left: 7%; }
  .loc[data-loc=gym] { left: 21%; }
  .loc[data-loc=casino] { left: 36%; }
  .loc[data-loc=bank] { left: 50%; }
  .loc[data-loc=bar] { left: 64%; }
  .loc .icon { position: relative; }
  .loc.locked .icon { filter: grayscale(1); opacity: .6; }
  .loc.locked .icon::after { content: '🔒'; position: absolute; right: -6px; bottom: -6px; font-size: 14px; }
  .loc[data-loc=store] { left: 79%; }
  .loc[data-loc=burger] { left: 93%; }
  .loc .name { margin-top: 30px; max-width: 46px; text-align: center; line-height: 1.15; font-size: 10px; }
  .bus {
    position: absolute; left: 36%; top: 46px; font-size: 24px; line-height: 1; pointer-events: none;
    transform: translateX(-50%); transition: left 1.2s ease-in-out;
  }
  .bus.right { transform: translateX(-50%) scaleX(-1); }
  .loc:not(:disabled):not(.locked) .icon { animation: beckon 1.6s ease-in-out infinite; }
  .loc:hover:not(:disabled) .icon { border-color: #fff; }
  /* Glow rather than grow, so the tap target never changes shape under a finger */
  @keyframes beckon { 50% { box-shadow: 0 0 0 4px rgba(245,197,66,.35); } }
  .map-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* Burger joint */
  .kitchen { position: relative; width: 240px; height: 240px; margin: 4px auto 14px; touch-action: none; cursor: pointer; }
  .grill {
    position: absolute; inset: 34px; border-radius: 50%;
    background: repeating-linear-gradient(90deg, #2b2b2b 0 10px, #4a4a4a 10px 14px);
    box-shadow: inset 0 0 18px rgba(0,0,0,.8), 0 0 0 6px #1d1d1d;
  }
  .patty {
    position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px;
    border-radius: 50%; background: radial-gradient(circle at 40% 35%, #d99a8a, #b4685a);
    box-shadow: 0 4px 10px rgba(0,0,0,.5); transition: background .4s;
  }
  .patty.cooking { background: radial-gradient(circle at 40% 35%, #b5714f, #8a4b2c); }
  .patty.done {
    background:
      repeating-linear-gradient(135deg, transparent 0 14px, rgba(30,15,5,.55) 14px 18px),
      radial-gradient(circle at 40% 35%, #8a4b2c, #5e311a);
  }
  .patty.burnt { background: radial-gradient(circle at 40% 35%, #3a3a3a, #111); }
  .patty.flip { animation: pattyFlip .5s ease; }
  @keyframes pattyFlip {
    0% { transform: translateY(0) rotateX(0); }
    50% { transform: translateY(-40px) rotateX(180deg); }
    100% { transform: translateY(0) rotateX(360deg); }
  }
  .smoke { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 34px; pointer-events: none; opacity: 0; }
  .smoke.show { animation: smoke 1s ease-out; }
  @keyframes smoke { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -110%); } }
  #dial { position: absolute; inset: 0; width: 240px; height: 240px; }
  .shift-info { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .career, .jobcard { background: rgba(0,0,0,.2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }

  /* Bar */
  .simon { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 230px; margin: 4px auto 12px; touch-action: none; }
  .simon .pad {
    aspect-ratio: 1; min-width: 0; border-radius: 18px; font-size: 40px; padding: 0;
    opacity: .5; transition: opacity .08s, filter .08s, box-shadow .08s;
  }
  .simon .pad[data-pad="0"] { background: #b3263a; }
  .simon .pad[data-pad="1"] { background: #2f6fd1; }
  .simon .pad[data-pad="2"] { background: #2a9d5c; }
  .simon .pad[data-pad="3"] { background: #c98f1c; }
  .simon, .simon .pad { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .simon .pad:hover:not(:disabled) { filter: brightness(1.1); }
  .simon .pad.lit { opacity: 1; filter: brightness(1.35); box-shadow: 0 0 22px rgba(255,255,255,.55); }
  .drink-status { text-align: center; color: var(--gold); font-weight: 600; margin-bottom: 10px; }
  .drink-status:empty { display: none; }
  .luck { text-align: center; color: var(--gold); font-size: 14px; font-weight: 600; margin: -6px 0 12px; }
  .luck:empty { display: none; }
  .flappy {
    display: block; width: 100%; max-width: 300px; aspect-ratio: 300 / 360; margin: 0 auto 12px;
    border-radius: 10px; touch-action: none; cursor: pointer;
  }
  .runner {
    display: block; width: 100%; max-width: 300px; aspect-ratio: 300 / 200; margin: 0 auto 12px;
    border-radius: 10px; touch-action: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .apps { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; color: var(--muted); }
  .apps:empty { display: none; }
  .apps li { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .bag { margin-bottom: 12px; }
  .bag:empty { display: none; }
  .bag button { background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.2); font-size: 14px; padding: 8px 12px; }
  .bag button.on { border-color: var(--gold); color: var(--gold); }
  .bag-note { width: 100%; text-align: center; color: var(--muted); font-size: 13px; }

  /* Store */
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: rgba(0,0,0,.25); border-radius: 10px; padding: 12px;
  }
  .item .icon { font-size: 34px; }
  .item .name { font-weight: 700; }
  .item .price { color: var(--gold); font-weight: 700; margin-left: 6px; }
  .item .desc { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .item .owned { font-size: 12px; color: var(--text); margin-top: 4px; }
  .item button { min-width: 70px; }

  /* Traffic: a crossing minigame shown over the page during some trips */
  .modal.traffic { z-index: 9; }
  .traffic .modal-box { padding: 14px 10px 12px; }
  .traffic .modal-box h2 { margin: 0 0 4px; }
  .traffic .modal-box p { margin: 0 0 10px; font-size: 14px; }
  .crossy {
    display: block; width: 100%; max-width: 300px; aspect-ratio: 300 / 330; margin: 0 auto 10px;
    border-radius: 8px; touch-action: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .dpad { touch-action: none; }
  .dpad button { min-width: 58px; font-size: 20px; padding: 10px 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }

  /* Achievements */
  .modal.ach { z-index: 9; }
  .ach-list { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; }
  .ach-list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .ach-list .ico { font-size: 24px; }
  .ach-list .name { font-weight: 700; }
  .ach-list .desc { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .ach-list li.got .name { color: var(--gold); }
  .ach-list li:not(.got) { opacity: .6; }

  /* Bank */
  .bank-box { background: rgba(0,0,0,.25); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .bank-box .name { font-weight: 700; }
  .bank-box .desc { font-size: 13px; color: var(--muted); margin: 4px 0 10px; line-height: 1.35; }
  .bank-box input {
    width: 76px; font: inherit; font-size: 18px; text-align: center; padding: 8px 4px;
    border-radius: 8px; border: none; background: #fff; color: #111;
  }
  .bank-box .row { align-items: center; gap: 8px; }
  .bank-box button { min-width: 0; padding: 12px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RIDE THE BUS</h1>
  <p class="sub" id="sub"></p>

  <div class="stats">
    <div class="stat"><div class="label">Bankroll</div><div class="value" id="bank">$0</div><div class="card-left" id="cardLeft"></div></div>
    <div class="stat"><div class="label" id="potLabel">On the line</div><div class="value" id="pot">—</div></div>
    <div class="stat hs"><div class="label">High score</div><div class="value" id="high">$0</div></div>
  </div>

  <div class="calendar">
    <div class="cal-top">
      <span class="cal-month" id="calMonth"></span>
      <span id="calRent"></span>
    </div>
    <div class="cal-bar"><div class="cal-fill" id="calFill"></div></div>
    <div class="cal-note" id="calNote"></div>
  </div>

  <div class="modal ach hidden" id="achBox">
    <div class="modal-box">
      <div class="modal-icon">🏆</div>
      <h2>Achievements</h2>
      <ul class="ach-list" id="achList"></ul>
      <button class="gold" id="achClose">Close</button>
    </div>
  </div>

  <div class="modal traffic hidden" id="traffic">
    <div class="modal-box">
      <h2>🚧 Traffic!</h2>
      <p id="trafficText"></p>
      <canvas id="road" class="crossy" width="300" height="330"></canvas>
      <div class="row dpad">
        <button data-move="left" aria-label="Left">◀</button>
        <button data-move="up" aria-label="Forward">▲</button>
        <button data-move="down" aria-label="Back">▼</button>
        <button data-move="right" aria-label="Right">▶</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <button class="gold" id="modalBtn"></button>
    </div>
  </div>

  <div class="map">
    <div class="map-area">
      <div class="road"></div>
      <button class="loc" data-loc="home"><span class="icon">🏠</span><span class="name">Home</span></button>
      <button class="loc" data-loc="gym"><span class="icon">🏋️</span><span class="name">Gym</span></button>
      <button class="loc" data-loc="casino"><span class="icon">🎰</span><span class="name">Casino</span></button>
      <button class="loc" data-loc="bank"><span class="icon">🏦</span><span class="name">Bank</span></button>
      <button class="loc" data-loc="bar"><span class="icon">🍸</span><span class="name">Bar</span></button>
      <button class="loc" data-loc="store"><span class="icon">🏪</span><span class="name">Store</span></button>
      <button class="loc" data-loc="burger"><span class="icon">🍔</span><span class="name">Burger Joint</span></button>
      <div class="bus" id="bus">🚌</div>
    </div>
    <div class="map-hint" id="mapHint"></div>
  </div>

  <!-- Burger joint -->
  <div id="burgerView" class="hidden">
    <div class="msg" id="bmsg"></div>
    <div class="panel">
      <div class="career"></div>
      <div class="question" id="bq"></div>
      <div class="kitchen" id="kitchen">
        <div class="grill"></div>
        <div class="patty" id="patty"></div>
        <div class="smoke" id="smoke">💨</div>
        <canvas id="dial" width="240" height="240"></canvas>
      </div>
      <div class="row bag" id="bag"></div>
      <div class="row">
        <button class="gold" id="shift">Start shift</button>
        <button id="flip">Flip! (Space)</button>
      </div>
      <div class="shift-info" id="shiftInfo"></div>
    </div>
  </div>

  <!-- Home -->
  <div id="homeView" class="hidden">
    <div class="msg" id="hmsg"></div>
    <div class="panel">
      <div class="career"></div>
      <div class="question" id="hq"></div>
      <canvas id="flappy" class="flappy hidden" width="300" height="360"></canvas>
      <div class="row"><button class="gold" id="apply">📨 Apply for a job</button></div>
      <div class="shift-info" id="homeInfo"></div>
      <ul class="apps" id="apps"></ul>
    </div>
  </div>

  <!-- Gym -->
  <div id="gymView" class="hidden">
    <div class="msg" id="gmsg"></div>
    <div class="panel">
      <div class="jobcard" id="gymCard"></div>
      <div class="question" id="gq"></div>
      <canvas id="runner" class="runner hidden" width="300" height="200"></canvas>
      <div class="row">
        <button class="gold" id="gymPay"></button>
        <button class="gold" id="gymStart">🏃 Work out</button>
      </div>
      <div class="shift-info" id="gymInfo"></div>
    </div>
  </div>

  <!-- Bar -->
  <div id="barView" class="hidden">
    <div class="msg" id="rmsg"></div>
    <div class="panel">
      <div class="jobcard" id="barCard"></div>
      <div class="question" id="rq"></div>
      <div class="simon" id="simon">
        <button class="pad" data-pad="0">🍷</button>
        <button class="pad" data-pad="1">🍸</button>
        <button class="pad" data-pad="2">🍺</button>
        <button class="pad" data-pad="3">🥃</button>
      </div>
      <div class="shift-info" id="simonInfo"></div>
      <div class="row" style="margin-top: 12px"><button class="gold" id="barBtn"></button></div>
    </div>
    <div class="panel" style="margin-top: 12px">
      <div class="question">Drinks: luck for your next few casino hands (one at a time)</div>
      <div class="drink-status" id="drinkStatus"></div>
      <div class="items" id="drinks"></div>
    </div>
  </div>

  <!-- Bank -->
  <div id="bankView" class="hidden">
    <div class="msg" id="kmsg"></div>
    <div class="panel">
      <div class="jobcard" id="creditCard"></div>
      <div class="bank-box">

    <button class="link" id="startOver">Start over</button>

</div>

<script>
const START_MONEY = 100;
const DAYS_PER_MONTH = 30;
const DAYS_PER_HAND = 1;    // 30 hands fill a month
const DAYS_PER_EVENT = 3;   // shifts, job applications and workouts; 10 fill a month
const BASE_RENT = 200;
const RENT_GROWTH = 1.1;
const MULTS = [2, 3, 4, 20];
const SUITS = [
  { s: '♥', name: 'hearts', color: 'red' },
  { s: '♦', name: 'diamonds', color: 'red' },
  { s: '♣', name: 'clubs', color: 'black' },
  { s: '♠', name: 'spades', color: 'black' },
];
const RANK_LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };

const $ = id => document.getElementById(id);

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : Number(v); }
  catch { return fallback; }
}
function save(key, v) { try { localStorage.setItem(key, String(v)); } catch {} }

let bank = load('rtb_bank', START_MONEY);
let high = load('rtb_high', START_MONEY);
let month = load('rtb_month', 1);
let day = load('rtb_day', 0);   // days used so far this month, 0..DAYS_PER_MONTH
let deck = [];
let drawn = [];
let wager = 0;
let round = 0;     // 0..3 while playing
let playing = false;
let loc = 'casino';      // a key of PLACES
let traveling = false;   // also true while crossing traffic
let travelTimer = null;

// Cash can go negative (hospital bills, collected loans); savings and loans carry cents
function fmt(n) { n = Math.round(n); return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(); }

function newDeck() {
  const d = [];
  for (const suit of SUITS) for (let r = 2; r <= 14; r++) d.push({ rank: r, ...suit });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

function label(c) { return RANK_LABEL[c.rank] || String(c.rank); }

function renderCards(resultIdx = -1, won = null) {
  const el = $('cards');
  el.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (playing && i === round ? ' active' : '');
    const card = document.createElement('div');
    const c = drawn[i];
    if (c) {
      card.className = `card face ${c.color}`;
      if (i === resultIdx) card.classList.add(won === null ? 'tie' : won ? 'win' : 'lose');
      card.innerHTML = `<div class="corner">${label(c)}${c.s}</div><div class="pip">${c.s}</div><div class="corner br">${label(c)}${c.s}</div>`;
    } else {
      card.className = playing && i === round ? 'card back' : 'card empty';
    }
    const mult = document.createElement('div');
    mult.className = 'mult';
    mult.textContent = MULTS[i] + '×';
    slot.append(card, mult);
    el.append(slot);
  }
}

function renderStats() {
  $('bank').textContent = fmt(bank);
  $('bank').classList.toggle('neg', bank < 0);
  $('cardLeft').textContent = cardLimit ? `💳 ${fmt(Math.max(0, spendable()))} left` : '';
  $('high').textContent = fmt(high);
  if (loc === 'bank') {
    $('potLabel').textContent = loan ? 'You owe' : 'Savings';
    $('pot').textContent = fmt(loan ? Math.ceil(loan.bal) : savings);
  } else if (loc === 'burger') {
    $('potLabel').textContent = 'This shift';
    $('pot').textContent = shift ? fmt(shift.earned) : '—';
  } else {
    $('potLabel').textContent = 'On the line';
    $('pot').textContent = playing && round > 0 ? fmt(wager * MULTS[round - 1]) : (playing ? fmt(wager) : '—');
  }
  renderMap();
  renderCalendar();
  renderLuck();
}

function setMsg(text, kind = '') {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function updateHigh() {
  if (bank > high) { high = bank; save('rtb_high', high); }
  save('rtb_bank', bank);
}

const QUESTIONS = [
  {
    q: 'Red or black?',
    opts: [{ k: 'red', t: 'Red', cls: 'red' }, { k: 'black', t: 'Black', cls: 'black' }],
    check: (k, c) => c.color === k,
  },
  {
    q: () => `Higher or lower than ${label(drawn[0])}?`,
    opts: [{ k: 'higher', t: 'Higher ▲' }, { k: 'lower', t: 'Lower ▼' }],
    tie: c => c.rank === drawn[0].rank,
    check: (k, c) => k === 'higher' ? c.rank > drawn[0].rank : c.rank < drawn[0].rank,
  },
  {
    q: () => {
      const [a, b] = [drawn[0].rank, drawn[1].rank].sort((x, y) => x - y);
      return `Inside or outside ${RANK_LABEL[a] || a} – ${RANK_LABEL[b] || b}?`;
    },
    opts: [{ k: 'inside', t: 'Inside' }, { k: 'outside', t: 'Outside' }],
    tie: c => c.rank === drawn[0].rank || c.rank === drawn[1].rank,
    check: (k, c) => {
      const lo = Math.min(drawn[0].rank, drawn[1].rank);
      const hi = Math.max(drawn[0].rank, drawn[1].rank);
      return k === 'inside' ? c.rank > lo && c.rank < hi : c.rank < lo || c.rank > hi;
    },
  },
  {
    q: 'Pick the suit',
    opts: SUITS.map(s => ({ k: s.name, t: s.s + ' ' + s.name[0].toUpperCase() + s.name.slice(1), cls: s.color })),
    check: (k, c) => c.name === k,
  },
];

function showPhase(name) {
  $('betPhase').classList.toggle('hidden', name !== 'bet');
  $('playPhase').classList.toggle('hidden', name !== 'play');
  $('brokePhase').classList.toggle('hidden', name !== 'broke');
}

function renderQuestion() {
  const Q = QUESTIONS[round];
  $('question').textContent = typeof Q.q === 'function' ? Q.q() : Q.q;
  const box = $('choices');
  box.innerHTML = '';
  for (const o of Q.opts) {
    const b = document.createElement('button');
    b.textContent = o.t;
    if (o.cls) b.classList.add(o.cls);
    b.onclick = () => guess(o.k);
    box.append(b);
  }
  const cash = $('cashout');
  cash.disabled = round === 0;
  cash.textContent = round === 0 ? 'Cash out' : `Cash out ${fmt(wager * MULTS[round - 1])}`;
}

function syncWagerControls() {
  const max = Math.max(1, spendable());
  const w = $('wager'), s = $('slider');
  w.max = s.max = max;
  let v = Math.floor(Number(w.value) || 0);
  v = Math.min(Math.max(v, 1), max);
  w.value = s.value = v;
  $('deal').disabled = spendable() < 1;
}

function toBet() {
  playing = false;
  if (spendable() < 1) {
    const dest = brokeDest();
    const broke = cardLimit ? "Your card's maxed out" : bank < 0 ? `You're ${fmt(-bank)} in the red` : "You're broke";
    $('brokeText').textContent = dest === 'bank'
      ? `${broke}, but you've got ${fmt(savings)} in savings. Ride to the Bank to withdraw some.`
      : dest === 'home'
      ? `${broke}, and you're out of a job. Go home and apply for work.`
      : `${broke}. Time to earn your bus fare at the ${PLACES[dest].name}.`;
    $('goWork').textContent = `🚌 Ride to the ${PLACES[dest].name}`;
    showPhase('broke');
    renderStats();
    return;
  }
  showPhase('bet');
  syncWagerControls();
  renderStats();
}

function deal() {
  syncWagerControls();
  wager = Number($('wager').value);
  if (wager < 1 || wager > spendable()) return;
  bank -= wager;
  save('rtb_bank', bank);
  deck = newDeck();
  drawn = [];
  round = 0;
  playing = true;
  setMsg('');
  showPhase('play');
  renderCards();
  renderQuestion();
  renderStats();
}

function guess(k) {
  if (deck.length < 2) deck = newDeck();
  let c = deck.pop();
  const tie = QUESTIONS[round].tie;
  // A drink gives a chance to dodge a losing card: it goes back in the deck and you draw again
  let lucky = false;
  if (drink && !(tie && tie(c)) && !QUESTIONS[round].check(k, c) && Math.random() < DRINKS[drink.k].luck) {
    deck.splice(Math.floor(Math.random() * deck.length), 0, c);
    c = deck.pop();
    lucky = true;
  }
  drawn[round] = c;
  const idx = round;
  if (tie && tie(c)) {
    setMsg(`Same rank (${label(c)}) — it's a push. Guess again for a new card.`);
    renderCards(idx, null);
    return;
  }
  const won = QUESTIONS[round].check(k, c);
  if (!won) {
    playing = false;
    setMsg(`Wrong! You lost ${fmt(wager)}.`, 'bad');
    renderCards(idx, false);
    updateHigh();
    toBet();
    handFinished();
    return;
  }
  round++;
  if (round === 4) {
    const payout = wager * MULTS[3];
    bank += payout;
    playing = false;
    setMsg(`${lucky ? '🍀 ' : ''}🚌 You rode the bus! +${fmt(payout)}`, 'good');
    unlock('cards');
    renderCards(idx, true);
    updateHigh();
    toBet();
    handFinished();
    return;
  }
  setMsg(`${lucky ? '🍀 Lucky! ' : ''}Correct! ${fmt(wager * MULTS[round - 1])} on the line.`, 'good');
  renderCards(idx, true);
  renderQuestion();
  renderStats();
}

function cashOut() {
  if (!playing || round === 0) return;
  const payout = wager * MULTS[round - 1];
  bank += payout;
  setMsg(`Cashed out ${fmt(payout)} (profit ${fmt(payout - wager)}).`, 'good');
  playing = false;
  renderCards();
  updateHigh();
  toBet();
  handFinished();
}

// A hand ended (win, loss or cash out): a day passes and any drink wears off a little
function handFinished() {
  if (drink) {
    drink.hands--;
    if (drink.hands <= 0) {
      $('msg').textContent += ` Your ${DRINKS[drink.k].name} wore off.`;
      drink = null;
    }
    saveDrink();
  }
  passTime(DAYS_PER_HAND);
}

// Wager controls
$('wager').addEventListener('input', () => { $('slider').value = $('wager').value; });
$('wager').addEventListener('change', syncWagerControls);
$('slider').addEventListener('input', () => { $('wager').value = $('slider').value; });
// Shortcuts are fractions of the whole bankroll
document.querySelectorAll('[data-frac]').forEach(b => b.addEventListener('click', () => {
  $('wager').value = Math.floor(spendable() * Number(b.dataset.frac));
  syncWagerControls();
}));

$('deal').onclick = deal;
$('cashout').onclick = cashOut;
// Where a broke player should go: savings to withdraw, a job they have, or Home to find one
function brokeDest() { return savings >= 1 ? 'bank' : !unemployed ? 'burger' : barJob && hasId ? 'bar' : 'home'; }
$('goWork').onclick = () => travel(brokeDest());
$('startOver').onclick = () => {
  if (playing || shift || applying || simon || working || traveling) return alert('Finish what you\'re doing first.');
  if (!confirm(`Start over? You'll go back to month 1 with ${fmt(START_MONEY)}, no jobs, an empty bag, no credit card and no bank account. Your high score is kept.`)) return;
  restartGame();
};
$('resetHigh').onclick = () => {
  if (!confirm('Reset your high score?')) return;
  high = bank;
  save('rtb_high', high);
  renderStats();
};

// ---------- Map ----------
const PLACES = {
  home: { name: 'Home', sub: 'Rest up, or job hunt if you lost your job.', x: 7 },
  gym: { name: 'Gym', sub: 'Work out to kick the smoking habit. Pay the monthly fee on your first visit each month.', x: 21 },
  casino: { name: 'Casino', sub: 'Guess 4 cards in a row. Cash out any time — or ride it all the way for 20×.', x: 36 },
  bank: { name: 'Bank', sub: 'Save money for daily interest, or borrow against your credit score.', x: 50 },
  bar: { name: 'Bar', sub: 'Tend bar by remembering orders, or buy a drink for some casino luck.', x: 64 },
  store: { name: 'Store', sub: 'Stock up on boosts before your next shift.', x: 79 },
  burger: { name: 'Burger Joint', sub: 'Hit the skill check to flip each burger. Great flips pay the most.', x: 93 },
};  // x = map position, % from the left

function placeBus(dest, x = PLACES[dest].x) {
  const bus = $('bus');
  bus.classList.toggle('right', PLACES[dest].x > PLACES[loc].x);
  bus.style.left = x + '%';
}

function renderMap() {
  const busy = playing || !!shift || traveling || applying || !!simon || working;
  document.querySelectorAll('.loc').forEach(b => {
    b.classList.toggle('here', b.dataset.loc === loc);
    b.disabled = busy || b.dataset.loc === loc;
    b.classList.toggle('locked', b.dataset.loc === 'bar' && !hasId);
  });
  $('mapHint').textContent = crossing ? '🚧 Stuck in traffic!'
    : traveling ? '🚌 On the road…'
    : playing ? 'Finish your hand before leaving'
    : shift ? 'Finish your shift before leaving'
    : applying || simon || working ? 'Finish what you\'re doing first'
    : 'Tap a location to travel' + (trafficChance() ? ` · 🚧 ${pct(trafficChance())} traffic chance per stop` : '');
}

function travel(dest) {
  if (dest === 'bar' && !hasId) {
    $('mapHint').textContent = `🪪 The bouncer wants ID. Buy one at the Store for ${fmt(ID_PRICE)}.`;
    beep(140, 0.15, 'sawtooth', 0.08);
    return;
  }
  if (dest === loc || playing || shift || traveling || applying || simon || working) return;
  traveling = true;
  flappy = null;   // a finished job application doesn't follow you around
  run = null;      // nor does a finished workout
  // Traffic is rolled once for each space between locations, in the order you pass them
  const order = Object.keys(PLACES), from = order.indexOf(loc), step = Math.sign(order.indexOf(dest) - from);
  for (let i = from; i !== order.indexOf(dest); i += step) {
    if (Math.random() < trafficChance()) return startCrossing(dest, (PLACES[order[i]].x + PLACES[order[i + step]].x) / 2);
  }
  drive(dest);
}

function drive(dest) {
  placeBus(dest);
  renderMap();
  travelTimer = setTimeout(() => {
    traveling = false;
    loc = dest;
    showLocation(true);
  }, 1200);
}

function showLocation(arrived = false) {
  $('casinoView').classList.toggle('hidden', loc !== 'casino');
  $('bankView').classList.toggle('hidden', loc !== 'bank');
  $('burgerView').classList.toggle('hidden', loc !== 'burger');
  $('storeView').classList.toggle('hidden', loc !== 'store');
  $('barView').classList.toggle('hidden', loc !== 'bar');
  $('gymView').classList.toggle('hidden', loc !== 'gym');
  $('homeView').classList.toggle('hidden', loc !== 'home');
  $('sub').textContent = PLACES[loc].sub;
  if (loc === 'casino') {
    drawn = [];
    setMsg(arrived && spendable() >= 1 ? `Welcome back. You've got ${fmt(spendable())} to play with${cardLimit ? ', counting your card' : ''}.` : '');
    renderCards();
    toBet();
  } else if (loc === 'home') {
    setHMsg('');
    renderHome();
    renderStats();
  } else if (loc === 'gym') {
    setGMsg('');
    renderGym();
    renderStats();
  } else if (loc === 'bar') {
    setRMsg('');
    renderBar();
    renderStats();
  } else if (loc === 'bank') {
    setKMsg('');
    renderBank(true);
    renderStats();
  } else if (loc === 'store') {
    setSMsg('');
    renderStore();
    renderStats();
  } else {
    setBMsg(spendable() < 1 ? 'Broke, huh? Grab a spatula.' : '');
    renderBurgerIdle();
    renderStats();
  }
}

document.querySelectorAll('.loc').forEach(b => b.onclick = () => travel(b.dataset.loc));

// ---------- Store ----------
const ITEMS = {
  cigs: {
    icon: '🚬', name: 'Cigarettes', price: 20,
    desc: 'Steadies your hands. The needle moves slower for 1 shift, so greats are easier. Habit-forming: each one works less often, and going without makes you shaky.',
  },
  wagyu: {
    icon: '🥩', name: 'Wagyu Burger', price: 50,
    desc: 'Premium patties. Burgers pay double for 1 shift, but the skill check zones are smaller.',
  },
};

function loadInv() {
  try { return { cigs: 0, wagyu: 0, ...JSON.parse(localStorage.getItem('rtb_inv') || '{}') }; }
  catch { return { cigs: 0, wagyu: 0 }; }
}
function saveInv() { try { localStorage.setItem('rtb_inv', JSON.stringify(inv)); } catch {} }

let inv = loadInv();   // items owned, by key
const bring = { cigs: true, wagyu: true };   // which owned items to use on the next shift (both can be used together)

function setSMsg(text, kind = '') {
  const m = $('smsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function renderStore() {
  const box = $('items');
  box.innerHTML = '';
  for (const [k, it] of Object.entries(ITEMS)) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<div class="icon">${it.icon}</div>
      <div><div><span class="name">${it.name}</span><span class="price">${fmt(it.price)}</span></div>
      <div class="desc">${it.desc}</div><div class="owned">In your bag: ${inv[k]}</div>
      ${k === 'cigs' && cigsSmoked ? `<div class="owned">Smoked ${cigsSmoked} so far · ${pct(cigDudChance())} chance the next one does nothing</div>` : ''}</div>`;
    const b = document.createElement('button');
    b.className = 'gold';
    b.textContent = 'Buy';
    b.disabled = spendable() < it.price;
    b.onclick = () => buy(k);
    row.append(b);
    box.append(row);
  }
  // The ID is a one-time purchase you keep, not a shift boost
  const row = document.createElement('div');
  row.className = 'item';
  row.innerHTML = `<div class="icon">🪪</div>
    <div><div><span class="name">ID</span><span class="price">${fmt(ID_PRICE)}</span></div>
    <div class="desc">Gets you past the bouncer at the Bar. Yours to keep.</div>
    <div class="owned">${hasId ? 'In your wallet ✓' : 'You need this to enter the Bar.'}</div></div>`;
  const b = document.createElement('button');
  b.className = 'gold';
  b.textContent = hasId ? 'Owned' : 'Buy';
  b.disabled = hasId || spendable() < ID_PRICE;
  b.onclick = buyId;
  row.append(b);
  box.append(row);
  // Credit card: bought with cash, then lets you spend below zero
  const card = document.createElement('div');
  card.className = 'item';
  card.innerHTML = `<div class="icon">💳</div>
    <div><div><span class="name">Credit Card</span><span class="price">${fmt(CARD_PRICE)}</span></div>
    <div class="desc">Spend down to ${fmt(-CARD_LIMITS[0])} anywhere: bets, shops, the gym, even rent. ${ratePct(CARD_RATE)} interest a day while you're below zero. Upgrade the limit at the Bank.</div>
    <div class="owned">${cardLimit ? `In your wallet ✓ (limit ${fmt(cardLimit)})` : 'Pay with cash.'}</div></div>`;
  const cb = document.createElement('button');
  cb.className = 'gold';
  cb.textContent = cardLimit ? 'Owned' : 'Buy';
  cb.disabled = !!cardLimit || bank < CARD_PRICE;
  cb.onclick = buyCard;
  card.append(cb);
  box.append(card);
}

function buyCard() {
  if (cardLimit || bank < CARD_PRICE) return;
  bank -= CARD_PRICE;
  save('rtb_bank', bank);
  cardLimit = CARD_LIMITS[0];
  save('rtb_card', cardLimit);
  ching();
  setSMsg(`💳 Got a credit card. You can spend down to ${fmt(-cardLimit)} now.`, 'good');
  renderStore();
  renderStats();
}

const ID_PRICE = 250;
let hasId = load('rtb_id', 0) === 1;

function buyId() {
  if (hasId || spendable() < ID_PRICE) return;
  bank -= ID_PRICE;
  save('rtb_bank', bank);
  hasId = true;
  save('rtb_id', 1);
  beep(1568, 0.08, 'triangle', 0.08);
  setTimeout(() => beep(2093, 0.25, 'triangle', 0.08), 70);
  setSMsg('🪪 Got your ID. The Bar will let you in now.', 'good');
  renderStore();
  renderStats();
}

function buy(k) {
  const it = ITEMS[k];
  if (spendable() < it.price) return;
  bank -= it.price;
  save('rtb_bank', bank);
  inv[k]++;
  bring[k] = true;
  saveInv();
  // Cash-register "ching": two quick high notes
  beep(1568, 0.08, 'triangle', 0.08);
  setTimeout(() => beep(2093, 0.25, 'triangle', 0.08), 70);
  setSMsg(`Bought ${it.icon} ${it.name}. It's in your bag and picked for your next shift.`, 'good');
  renderStore();
  renderStats();
}

// ---------- Burger joint: skill-check minigame ----------
const MAX_BURNT = 3;        // burning more than this ends the shift and costs XP
const XP_MIN_FLIPS = 5;    // good or great flips needed in a shift to earn XP
const XP_PENALTY = 15;
// Rank is set by total XP; higher ranks cook more burgers per shift
const RANKS = [
  { name: 'Trainee', xp: 0, burgers: 6 },
  { name: 'Line Cook', xp: 20, burgers: 8 },
  { name: 'Grill Cook', xp: 50, burgers: 10 },
  { name: 'Shift Lead', xp: 100, burgers: 12 },
  { name: 'Kitchen Manager', xp: 175, burgers: 15 },
];
const PAY_GOOD = 5;
const PAY_GREAT = 12;
const CIGS_SLOWDOWN = 1.6;   // needle takes this much longer per turn
// Addiction: every cigarette smoked raises the chance the next one does nothing,
// and a shift without a working one runs the needle faster (withdrawal)
const CIG_TOLERANCE = 0.04;      // dud chance added per cigarette already smoked
const CIG_TOLERANCE_MAX = 0.75;
const WITHDRAWAL_MAX = 0.5;      // needle speed-up at its worst (+50%)
const WITHDRAWAL_CIGS = 20;      // cigarettes smoked to reach it; it builds up evenly (2.5% each)
let cigsSmoked = load('rtb_cigs', 0);
const cigDudChance = () => Math.min(CIG_TOLERANCE_MAX, cigsSmoked * CIG_TOLERANCE);
const withdrawal = () => Math.min(WITHDRAWAL_MAX, cigsSmoked / WITHDRAWAL_CIGS * WITHDRAWAL_MAX);
const pct = x => Math.round(x * 100) + '%';
const WAGYU_PAY = 2;
const WAGYU_ZONE = 0.6;      // zones shrink to this fraction

let shift = null;   // { burger, length, earned, streak, burnt, flipped, greats, boosts: { cigs, wagyu }, cigWorked, shaky }
let xp = load('rtb_xp', 0);
let unemployed = load('rtb_jobless', 1) === 1;   // new games start without a job
let check = null;   // active skill check: { start, good, great, dur, t0 }
let checkTimer = null;
let audio = null;

const dial = $('dial');
const ctx = dial.getContext('2d');
(function setupDial() {
  const dpr = window.devicePixelRatio || 1;
  dial.width = 240 * dpr;
  dial.height = 240 * dpr;
  ctx.scale(dpr, dpr);
})();

function setBMsg(text, kind = '') {
  const m = $('bmsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function beep(freq, dur = 0.08, type = 'sine', vol = 0.15) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  } catch {}
}

// Fraction of a full turn (0 = 12 o'clock) to canvas angle
const ang = f => -Math.PI / 2 + f * Math.PI * 2;

function drawDial(needle = null, faded = false) {
  const c = 120, r = 104;
  ctx.clearRect(0, 0, 240, 240);
  ctx.lineCap = 'butt';
  ctx.globalAlpha = faded ? 0.35 : 1;
  ctx.beginPath();
  ctx.arc(c, c, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 3;
  ctx.stroke();
  if (check) {
    // Good zone: hollow outline, like DbD
    ctx.beginPath();
    ctx.arc(c, c, r, ang(check.start), ang(check.start + check.good));
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 14;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(c, c, r, ang(check.start + check.great) + 0.02, ang(check.start + check.good) - 0.02);
    ctx.strokeStyle = '#1d1d1d';
    ctx.lineWidth = 9;
    ctx.stroke();
    // Great zone: solid white at the start of the good zone
    ctx.beginPath();
    ctx.arc(c, c, r, ang(check.start), ang(check.start + check.great));
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 14;
    ctx.stroke();
  }
  if (needle !== null) {
    const a = ang(needle);
    ctx.beginPath();
    ctx.moveTo(c + Math.cos(a) * (r - 18), c + Math.sin(a) * (r - 18));
    ctx.lineTo(c + Math.cos(a) * (r + 12), c + Math.sin(a) * (r + 12));
    ctx.strokeStyle = '#ff3b3b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function setPatty(state, flip = false) {
  const p = $('patty');
  p.className = 'patty' + (state ? ' ' + state : '');
  if (flip) { void p.offsetWidth; p.classList.add('flip'); }
}

function rankIndex(x, ranks = RANKS) {
  let i = 0;
  while (i + 1 < ranks.length && x >= ranks[i + 1].xp) i++;
  return i;
}

// Rank card: title, XP on the right, progress bar to the next rank, and a note
function careerCardHTML(head, right, pct, note) {
  return `<div class="cal-top"><span class="cal-month">${head}</span><span>${right}</span></div>
      <div class="cal-bar"><div class="cal-fill" style="width:${pct}%"></div></div>
      <div class="cal-note">${note}</div>`;
}
function rankOf(x) { return RANKS[rankIndex(x)]; }
function saveCareer() { save('rtb_xp', xp); save('rtb_jobless', unemployed ? 1 : 0); save('rtb_hoops', hoopsNeeded); }

function renderCareer() {
  const i = rankIndex(xp), r = RANKS[i], next = RANKS[i + 1];
  let head, right, pct, note;
  if (unemployed) {
    head = '❌ Unemployed';
    right = '';
    pct = 0;
    note = 'No job. Go Home and apply to get hired at the Burger Joint.';
  } else {
    head = `👨‍🍳 ${r.name}`;
    right = next ? `XP ${xp} / ${next.xp}` : `XP ${xp} · top rank`;
    pct = next ? (xp - r.xp) / (next.xp - r.xp) * 100 : 100;
    note = `${r.burgers} burgers per shift` + (next ? ` · Next: ${next.name} (${next.burgers})` : '');
  }
  document.querySelectorAll('.career').forEach(el => {
    el.innerHTML = careerCardHTML(head, right, pct, note);
  });
}

// Apply XP for a finished shift. Returns a short result line; promotions,
// demotions and firing also get a popup.
function settleCareer(s) {
  const before = rankIndex(xp);
  let line;
  if (s.burnt > MAX_BURNT) {
    xp -= XP_PENALTY;
    line = `−${XP_PENALTY} XP for burning ${s.burnt}.`;
  } else if (s.flipped >= XP_MIN_FLIPS) {
    const gained = s.flipped + s.greats;   // greats count double
    xp += gained;
    line = `+${gained} XP.`;
  } else {
    line = `No XP: only ${s.flipped} flipped (need ${XP_MIN_FLIPS}).`;
  }
  if (xp < 0) {
    xp = 0;
    unemployed = true;
    const extra = EXTRA_HOOPS[0] + Math.floor(Math.random() * (EXTRA_HOOPS[1] - EXTRA_HOOPS[0] + 1));
    hoopsNeeded += extra;
    showModal('📋', "You're fired!",
      `The manager has seen enough burnt burgers. Word gets around: you'll need to jump through ${hoopsNeeded} hoops (+${extra}) to get hired again.`,
      'Head home', () => travel('home'), 'bad');
  } else {
    const after = rankIndex(xp);
    if (after > before) {
      showModal('⭐', 'Promoted!', `You're now a ${RANKS[after].name}. Shifts are ${RANKS[after].burgers} burgers long.`, 'Nice', () => {});
    } else if (after < before) {
      showModal('📉', 'Demoted', `You're back to ${RANKS[after].name}. Shifts are ${RANKS[after].burgers} burgers long.`, 'OK', () => {}, 'bad');
    }
  }
  saveCareer();
  return line;
}

function smokingNote() {
  return `🚬 Smoked ${cigsSmoked}: next cig has a ${pct(cigDudChance())} chance of doing nothing, and without one the needle is ${pct(withdrawal())} faster.`;
}

function renderShiftInfo() {
  $('shiftInfo').textContent = shift
    ? `Burger ${Math.min(shift.burger, shift.length)}/${shift.length} · Flipped ${shift.flipped} · Burnt ${shift.burnt}/${MAX_BURNT}`
      + (shift.boosts.cigs ? (shift.cigWorked ? ' · 🚬' : ' · 🚬 (dud)') : '')
      + (shift.boosts.wagyu ? ' · 🥩' : '')
      + (shift.shaky ? ' · 😬' : '')
    : `Good flip ${fmt(PAY_GOOD)}, great flip ${fmt(PAY_GREAT)} + streak bonus. Flip ${XP_MIN_FLIPS}+ to earn XP. Burn more than ${MAX_BURNT} and you're sent home and lose XP.`
      + (cigsSmoked ? ` ${smokingNote()}` : '');
}

// Pick which owned item to use on the next shift (only one at a time)
function renderBag() {
  const box = $('bag');
  box.innerHTML = '';
  if (shift || unemployed) return;
  const owned = Object.keys(ITEMS).filter(k => inv[k] > 0);
  if (!owned.length) return;
  for (const k of owned) {
    const b = document.createElement('button');
    b.classList.toggle('on', bring[k]);
    b.textContent = `${bring[k] ? '✓' : '○'} ${ITEMS[k].icon} ${ITEMS[k].name} (${inv[k]})`;
    b.onclick = () => { bring[k] = !bring[k]; renderBag(); };
    box.append(b);
  }
  const note = document.createElement('div');
  note.className = 'bag-note';
  note.textContent = 'Checked items get used up when you start the shift. You can use both.';
  box.append(note);
}

function renderBurgerIdle() {
  check = null;
  drawDial(null, true);
  if (!shift) setPatty('');
  $('bq').textContent = unemployed ? "You don't work here. Go Home and apply for a job." : shift ? '' : 'Ready to work?';
  $('shift').classList.toggle('hidden', !!shift || unemployed);
  $('shift').textContent = 'Start shift';
  $('flip').disabled = true;
  renderShiftInfo();
  renderBag();
  renderCareer();
}

function startShift() {
  if (shift || unemployed) return;
  beep(1, 0.01, 'sine', 0.001); // unlock audio on this tap
  const boosts = {};
  for (const k of Object.keys(ITEMS)) {
    boosts[k] = bring[k] && inv[k] > 0;
    if (boosts[k]) inv[k]--;
  }
  saveInv();
  // Cigarettes: tolerance can make one a dud; going without one after smoking means withdrawal
  let cigWorked = false, shaky = 0;
  if (boosts.cigs) {
    cigWorked = Math.random() >= cigDudChance();
    cigsSmoked++;
    if (cigsSmoked >= IRON_LUNG_CIGS) unlock('lung');
    save('rtb_cigs', cigsSmoked);
  } else if (cigsSmoked > 0) {
    shaky = withdrawal();
  }
  shift = { burger: 0, length: rankOf(xp).burgers, earned: 0, streak: 0, burnt: 0, flipped: 0, greats: 0, boosts, cigWorked, shaky };
  $('shift').classList.add('hidden');
  renderBag();
  const parts = [];
  if (boosts.cigs) parts.push(cigWorked ? '🚬 A smoke steadies your hands.' : '🚬 You lit up, but felt nothing. Your tolerance is building.');
  if (boosts.wagyu) parts.push('🥩 Wagyu on the grill: double pay, smaller zones.');
  if (shaky) parts.push(`😬 Withdrawal: no smoke today, the needle is ${pct(shaky)} faster.`);
  setBMsg(parts.join(' ') || 'Clocked in. Watch the grill…', (boosts.cigs && !cigWorked) || shaky ? 'bad' : '');
  renderStats();
  nextBurger();
}

function nextBurger() {
  shift.burger++;
  check = null;
  setPatty('');
  drawDial(null, true);
  $('bq').textContent = 'Sizzling… get ready';
  $('flip').disabled = false;
  renderShiftInfo();
  // Random wait so the check can't be timed from the previous one
  checkTimer = setTimeout(() => {
    setPatty('cooking');
    const s = shift.streak;
    let good = Math.max(0.06, 0.13 - s * 0.01);
    let dur = Math.max(700, 1150 - s * 50);
    if (shift.boosts.wagyu) good *= WAGYU_ZONE;
    if (shift.cigWorked) dur *= CIGS_SLOWDOWN;
    if (shift.shaky) dur /= 1 + shift.shaky;   // +50% speed means the turn takes 1/1.5 as long
    check = {
      start: 0.3 + Math.random() * 0.5,
      good,
      great: good * 0.3,
      dur,
      t0: performance.now(),
    };
    $('bq').textContent = 'FLIP IT!';
    beep(880, 0.12, 'triangle', 0.2);
    requestAnimationFrame(tick);
  }, 700 + Math.random() * 1300);
}

function tick(now) {
  if (!check) return;
  const pos = (now - check.t0) / check.dur;
  if (pos > check.start + check.good + 0.03) { resolve(pos, 'miss'); return; }
  drawDial(pos);
  requestAnimationFrame(tick);
}

function hit(e) {
  if (!shift) return;
  if (!check) {
    // Pressing before the check appears doesn't count, same as DbD
    return;
  }
  // The event's own timestamp is when the finger or key actually went down,
  // so a busy frame or slow handler doesn't count against the player
  const at = e && e.timeStamp > check.t0 ? Math.min(e.timeStamp, performance.now()) : performance.now();
  const pos = (at - check.t0) / check.dur;
  const d = pos - check.start;
  const result = d >= 0 && d < check.great ? 'great' : d >= 0 && d <= check.good ? 'good' : 'miss';
  resolve(pos, result);
}

function resolve(pos, result) {
  drawDial(pos);
  check = null;
  $('flip').disabled = true;
  if (result === 'miss') {
    shift.burnt++;
    shift.streak = 0;
    setPatty('burnt');
    const s = $('smoke');
    s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
    beep(140, 0.3, 'sawtooth', 0.15);
    setBMsg('Burnt it! 🔥', 'bad');
  } else {
    const pay = (result === 'great' ? PAY_GREAT + shift.streak * 2 : PAY_GOOD) * (shift.boosts.wagyu ? WAGYU_PAY : 1);
    shift.streak++;
    shift.flipped++;
    if (result === 'great') shift.greats++;
    shift.earned += pay;
    bank += pay;
    updateHigh();
    setPatty('done', true);
    beep(result === 'great' ? 1320 : 660, 0.12, 'sine', 0.18);
    setBMsg(result === 'great' ? `Great flip! +${fmt(pay)}` : `Good flip. +${fmt(pay)}`, 'good');
  }
  $('bq').textContent = '';
  renderShiftInfo();
  renderStats();
  checkTimer = setTimeout(() => {
    if (shift.burnt > MAX_BURNT) endShift(`${shift.burnt} burnt! The manager sent you home with ${fmt(shift.earned)}.`, 'bad');
    else if (shift.burger >= shift.length) endShift(`Shift over! You earned ${fmt(shift.earned)}.`, 'good');
    else nextBurger();
  }, 900);
}

function endShift(text, kind) {
  clearTimeout(checkTimer);
  const done = shift;
  shift = null;
  check = null;
  setBMsg(`${text} ${settleCareer(done)}`, kind);
  // Iron achievements: a whole shift at max withdrawal without burning a patty (burning none means it wasn't cut short)
  if (done.burnt === 0 && done.shaky >= WITHDRAWAL_MAX) {
    unlock('foal');
    if (done.length === RANKS[RANKS.length - 1].burgers) {
      unlock('horse');
      if (done.greats === done.length) {
        unlock('stallion');
        if (done.boosts.wagyu) unlock('king');
      }
    }
  }
  renderBurgerIdle();
  if (!unemployed) {
    $('bq').textContent = 'Work another shift, or ride back to the casino.';
    $('shift').textContent = 'Work another shift';
  }
  renderStats();
  passTime(DAYS_PER_EVENT);
}

$('shift').onclick = startShift;
$('flip').addEventListener('pointerdown', e => { e.preventDefault(); hit(e); });
$('flip').addEventListener('click', e => { if (e.detail === 0) hit(e); });   // keyboard activation
$('kitchen').addEventListener('pointerdown', e => { e.preventDefault(); hit(e); });
document.addEventListener('keydown', e => {
  if (!$('achBox').classList.contains('hidden')) {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') { e.preventDefault(); $('achClose').click(); }
    return;
  }
  if (modalOpen()) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); $('modalBtn').click(); }
    return;
  }
  if (crossing) {
    const dir = CROSS_KEYS[e.code];
    if (dir) { e.preventDefault(); if (!e.repeat) hop(dir); }
    return;
  }
  if (loc === 'bar' && simon && /^Digit[1-4]$/.test(e.code)) {
    e.preventDefault();
    if (!e.repeat) pressPad(Number(e.code.slice(5)) - 1);
    return;
  }
  if (e.code !== 'Space' || traveling) return;
  if (loc === 'gym' && gymPaid()) {
    e.preventDefault();
    if (e.repeat) return;
    if (working) jump(); else startWorkout();
    return;
  }
  if (loc === 'home' && unemployed) {
    e.preventDefault();
    if (e.repeat) return;
    if (applying) flap(); else applyForJob();
    return;
  }
  if (loc !== 'burger') return;
  e.preventDefault();
  if (e.repeat) return;
  if (shift) hit(e); else startShift();
});

// ---------- Home: job hunting (a flappy-bird run through hoops) ----------
const START_HOOPS = 5;
const EXTRA_HOOPS = [3, 5];   // each firing adds this many more (random, inclusive), and it stacks
let hoopsNeeded = load('rtb_hoops', START_HOOPS);
// Canvas size in CSS px, and physics in px and seconds
const FL = { w: 300, h: 360, ground: 30, birdX: 80, r: 12, gravity: 1400, jump: 400, speed: 130, spacing: 175, gap: 112, post: 26 };
const REJECTIONS = [
  '"We\'ll keep your résumé on file."',
  'No callback.',
  '"Didn\'t you set our grill on fire?"',
  'The manager laughed and hung up.',
  '"We went with someone who can flip a burger."',
  'Voicemail full.',
  '"Try again next week."',
];
let apps = [];          // rejection lines since losing the job, newest first
let applying = false;   // a run is in progress (blocks travel)
let flappy = null;      // { state: 'ready'|'playing'|'won'|'crashed', y, vy, t, last, hoops: [{ x, gapY, passed }], score }

const fcan = $('flappy');
const fctx = fcan.getContext('2d');
(function setupFlappy() {
  const dpr = window.devicePixelRatio || 1;
  fcan.width = FL.w * dpr;
  fcan.height = FL.h * dpr;
  fctx.scale(dpr, dpr);
})();

function setHMsg(text, kind = '') {
  const m = $('hmsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function renderHome() {
  renderCareer();
  $('hq').textContent = unemployed
    ? `No job. Jump through ${hoopsNeeded} hoops to get hired at the Burger Joint.`
    : `Home sweet home. You've got a job at the Burger Joint as a ${rankOf(xp).name}.`;
  const b = $('apply');
  b.classList.toggle('hidden', !unemployed || applying);
  b.textContent = apps.length ? '📨 Apply again' : '📨 Apply for a job';
  fcan.classList.toggle('hidden', !unemployed || !flappy);
  $('homeInfo').textContent = !unemployed ? ''
    : applying ? 'Tap the game or press Space to flap.'
    : `Each application takes ${DAYS_PER_EVENT} days.`;
  $('apps').innerHTML = unemployed ? apps.map((t, i) => `<li>Application #${apps.length - i}: ${t}</li>`).join('') : '';
}

function spawnHoop(x) {
  const prev = flappy.hoops[flappy.hoops.length - 1];
  // Keep each hoop within reach of the last one
  const min = Math.max(70, prev ? prev.gapY - 110 : 0);
  const max = Math.min(FL.h - FL.ground - 70, prev ? prev.gapY + 110 : Infinity);
  flappy.hoops.push({ x, gapY: min + Math.random() * (max - min), passed: false });
}

function applyForJob() {
  if (!unemployed || applying) return;
  beep(1, 0.01, 'sine', 0.001); // unlock audio on this tap
  applying = true;
  flappy = { state: 'ready', y: FL.h / 2 - 20, vy: 0, t: 0, last: performance.now(), hoops: [], score: 0 };
  spawnHoop(FL.w - 40);   // first hoop starts in view
  setHMsg('');
  renderHome();
  renderMap();
  requestAnimationFrame(flappyLoop);
}

function flap() {
  if (!flappy || !applying) return;
  if (flappy.state === 'ready') flappy.state = 'playing';
  if (flappy.state !== 'playing') return;
  flappy.vy = -FL.jump;
  beep(520, 0.05, 'square', 0.04);
}

function flappyLoop(now) {
  const f = flappy;
  if (!f || (f.state !== 'ready' && f.state !== 'playing')) return;
  const dt = Math.max(0, Math.min(0.033, (now - f.last) / 1000));
  f.last = now;
  f.t += dt;
  if (f.state === 'ready') {
    f.y = FL.h / 2 - 20 + Math.sin(f.t * 4) * 6;   // bob until the first flap
  } else {
    f.vy += FL.gravity * dt;
    f.y += f.vy * dt;
    if (f.y < FL.r) { f.y = FL.r; f.vy = 0; }
    for (const h of f.hoops) h.x -= FL.speed * dt;
    const lastHoop = f.hoops[f.hoops.length - 1];
    if (lastHoop.x < FL.w - FL.spacing) spawnHoop(lastHoop.x + FL.spacing);
    f.hoops = f.hoops.filter(h => h.x > -FL.post);
    for (const h of f.hoops) {
      // Inside the hoop's column, the bird must be within the opening
      if (Math.abs(h.x - FL.birdX) < FL.post / 2 + FL.r - 4) {
        if (f.y - FL.r < h.gapY - FL.gap / 2 || f.y + FL.r > h.gapY + FL.gap / 2) return endApplication(false);
      }
      if (!h.passed && h.x < FL.birdX - FL.post / 2) {
        h.passed = true;
        f.score++;
        beep(1046, 0.08, 'triangle', 0.12);
        if (f.score >= hoopsNeeded) return endApplication(true);
      }
    }
    if (f.y + FL.r > FL.h - FL.ground) { f.y = FL.h - FL.ground - FL.r; return endApplication(false); }
  }
  drawFlappy();
  requestAnimationFrame(flappyLoop);
}

function drawFlappy() {
  const f = flappy, c = fctx;
  c.clearRect(0, 0, FL.w, FL.h);
  const sky = c.createLinearGradient(0, 0, 0, FL.h);
  sky.addColorStop(0, '#2c7a55');
  sky.addColorStop(1, '#15503a');
  c.fillStyle = sky;
  c.fillRect(0, 0, FL.w, FL.h);
  c.fillStyle = '#0a2e1d';
  c.fillRect(0, FL.h - FL.ground, FL.w, FL.ground);
  c.fillStyle = 'rgba(245,197,66,.6)';
  c.fillRect(0, FL.h - FL.ground, FL.w, 2);
  const ring = (h, from, to) => {
    c.beginPath();
    c.ellipse(h.x, h.gapY, 10, FL.gap / 2, 0, from, to);
    c.strokeStyle = '#f5c542';
    c.lineWidth = 6;
    c.stroke();
  };
  for (const h of f.hoops) {
    // Posts above and below the hoop
    c.fillStyle = '#2f4a3c';
    c.fillRect(h.x - FL.post / 2, 0, FL.post, h.gapY - FL.gap / 2);
    c.fillRect(h.x - FL.post / 2, h.gapY + FL.gap / 2, FL.post, FL.h - FL.ground - h.gapY - FL.gap / 2);
    ring(h, -Math.PI / 2, Math.PI / 2);   // back half, behind the bird
  }
  c.save();
  c.translate(FL.birdX, f.y);
  c.rotate(Math.max(-0.5, Math.min(1, f.vy / 700)));
  c.font = '26px system-ui, sans-serif';
  c.textAlign = 'center';

  c.textAlign = 'center';
  c.textBaseline = 'top';

// ---------- Bar: Simon Says job and luck drinks ----------
const BAR_APPLY_STEPS = 7;
const BAR_XP_PENALTY = 8;          // for a mistake before getting halfway through a shift
// Bar rank comes from bar XP. steps = shift length range (inclusive), pay = per drink
// in each order you repeat correctly, tip = for finishing the whole shift
const BAR_RANKS = [
  { name: 'Barback', xp: 0, steps: [5, 7], pay: 2, tip: 15 },
  { name: 'Bartender', xp: 25, steps: [6, 8], pay: 2, tip: 25 },
  { name: 'Mixologist', xp: 60, steps: [7, 9], pay: 3, tip: 35 },
  { name: 'Head Bartender', xp: 110, steps: [8, 10], pay: 3, tip: 50 },
  { name: 'Bar Manager', xp: 180, steps: [9, 12], pay: 4, tip: 70 },
];
const PAD_TONES = [330, 392, 494, 587];
const DRINKS = {
  beer: { icon: '🍺', name: 'Beer', price: 15, luck: 0.15, hands: 3 },
  whiskey: { icon: '🥃', name: 'Whiskey', price: 35, luck: 0.3, hands: 4 },
  champagne: { icon: '🍾', name: 'Champagne', price: 75, luck: 0.5, hands: 5 },
};

let barJob = load('rtb_barjob', 0) === 1;
let barXp = load('rtb_barxp', 0);
let drink = loadDrink();   // { k, hands } for the active drink, or null
let simon = null;          // { mode: 'apply'|'shift', seq, round, idx, phase: 'showing'|'input', earned }

function loadDrink() {
  try { const d = JSON.parse(localStorage.getItem('rtb_drink') || 'null'); return d && DRINKS[d.k] && d.hands > 0 ? d : null; }
  catch { return null; }
}
function saveDrink() { try { localStorage.setItem('rtb_drink', JSON.stringify(drink)); } catch {} }
function saveBar() { save('rtb_barjob', barJob ? 1 : 0); save('rtb_barxp', barXp); }
function barRank() { return BAR_RANKS[rankIndex(barXp, BAR_RANKS)]; }

function setRMsg(text, kind = '') {
  const m = $('rmsg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

function renderLuck() {
  const d = drink && DRINKS[drink.k];
  $('luckInfo').textContent = d
    ? `${d.icon} ${d.name}: ${Math.round(d.luck * 100)}% luck for ${drink.hands} more hand${drink.hands === 1 ? '' : 's'}`

}

function renderBar() {
  if (barJob) {
    const i = rankIndex(barXp, BAR_RANKS), r = BAR_RANKS[i], next = BAR_RANKS[i + 1];

function buyDrink(k) {

}

function lightPad(p, ms) {
  const el = document.querySelector(`.pad[data-pad="${p}"]`);
  el.classList.add('lit');
  beep(PAD_TONES[p], ms / 1000, 'sine', 0.15);
  setTimeout(() => el.classList.remove('lit'), ms);
}

function startSimon() {
  if (simon) return;
  beep(1, 0.01, 'sine', 0.001); // unlock audio on this tap
  const mode = barJob ? 'shift' : 'apply';
  const r = barRank();
  const n = mode === 'apply' ? BAR_APPLY_STEPS : r.steps[0] + Math.floor(Math.random() * (r.steps[1] - r.steps[0] + 1));
  simon = { mode, seq: Array.from({ length: n }, () => Math.floor(Math.random() * 4)), round: 1, idx: 0, phase: 'showing', earned: 0, pay: r.pay, tip: r.tip };
  setRMsg(mode === 'shift' ? `Tonight's rush: ${n} drinks.` : '');
  renderBar();
  renderMap();
  setTimeout(showRound, 600);
}

// Play the first `round` drinks of the order, then hand over to the player
function showRound() {
  if (!simon) return;
  const s = simon;
  s.phase = 'showing';
  s.idx = 0;
  renderBar();
  const gap = Math.max(380, 650 - s.round * 25);
  for (let i = 0; i < s.round; i++) setTimeout(() => simon === s && lightPad(s.seq[i], gap * 0.6), i * gap);
  setTimeout(() => {
    if (simon !== s) return;
    s.phase = 'input';
    renderBar();
  }, s.round * gap);
}

function pressPad(p) {
  const s = simon;
  if (!s || s.phase !== 'input') return;
  if (s.seq[s.idx] !== p) {
    document.querySelector(`.pad[data-pad="${p}"]`).classList.add('lit');
    setTimeout(() => document.querySelector(`.pad[data-pad="${p}"]`).classList.remove('lit'), 250);
    return endSimon(false);
  }
  lightPad(p, 200);
  s.idx++;
  if (s.idx < s.round) return;
  // Order complete
  if (s.mode === 'shift') {
    const pay = s.round * s.pay;
    s.earned += pay;
    bank += pay;
    updateHigh();
    setRMsg(`Order served! +${fmt(pay)}`, 'good');
    renderStats();
  }
  if (s.round === s.seq.length) return endSimon(true);
  s.round++;
  s.phase = 'showing';
  renderBar();
  setTimeout(showRound, 700);
}

function endSimon(ok) {
  const s = simon;
  simon = null;
  if (!ok) beep(140, 0.3, 'sawtooth', 0.15);
  if (s.mode === 'apply') {
    if (ok) {
      barJob = true;
      barXp = 0;
      saveBar();
      setRMsg('');
      showModal('🍸', "You're hired!", `The bar is taking you on as a ${BAR_RANKS[0].name}. Work a shift here any time.`, 'Nice', () => renderBar());
    } else {
      setRMsg(`Wrong drink. You remembered ${s.round - 1} of ${s.seq.length} drinks. Try again.`, 'bad');
    }
    renderBar();
    passTime(DAYS_PER_EVENT);
  } else {
    if (ok) {
      s.earned += s.tip;
      bank += s.tip;
      updateHigh();
      setRMsg(`Shift done! You earned ${fmt(s.earned)}, including a ${fmt(s.tip)} tip. ${settleBarXp(s, true)}`, 'good');
    } else {
      setRMsg(`Wrong drink! Shift over. You earned ${fmt(s.earned)}. ${settleBarXp(s, false)}`, 'bad');
    }
    renderBar();
    passTime(DAYS_PER_EVENT);
  }
  renderMap();
}

// Bar XP for a finished shift; returns a short result line. Promotions and
// demotions get a popup. XP never goes below 0, so you can't be fired here.
function settleBarXp(s, ok) {
  const before = rankIndex(barXp, BAR_RANKS);
  const done = s.round - 1;   // orders completed before the mistake
  let line;
  if (ok) {
    barXp += s.seq.length;
    line = `+${s.seq.length} XP.`;
  } else if (done < s.seq.length / 2) {
    const lost = Math.min(BAR_XP_PENALTY, barXp);
    barXp -= lost;
    line = lost ? `−${lost} XP for messing up early.` : 'No XP.';
  } else {
    line = 'No XP (finish the shift to earn it).';
  }
  const after = rankIndex(barXp, BAR_RANKS);
  if (after > before) {
    const r = BAR_RANKS[after];
    showModal('⭐', 'Promoted!', `You're now ${/^[AEIOU]/.test(r.name) ? 'an' : 'a'} ${r.name}: ${r.steps[0]}–${r.steps[1]} drink shifts, ${fmt(r.pay)} per drink and a ${fmt(r.tip)} tip.`, 'Nice', () => {});
  } else if (after < before) {
    showModal('📉', 'Demoted', `You're back to ${BAR_RANKS[after].name}.`, 'OK', () => {}, 'bad');
  }
  saveBar();
  return line;
}
